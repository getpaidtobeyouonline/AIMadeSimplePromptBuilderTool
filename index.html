<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Made Simple Prompt Builder</title>
<meta name="description" content="Every prompt from the 19 courses as fill-in boxes. Type your answers, copy, paste.">
<meta name="theme-color" content="#1a0a2e">
<style>
:root{
  color-scheme:dark;
  --ink:#1a0a2e;--deep:#241244;--card:#2e1a52;--line:rgba(255,255,255,.13);
  --purple:#7c4dde;--purple2:#9b6cff;--gold:#f0c24b;--mint:#4ade80;--sky:#60a5fa;
  --fg:#fff;--mut:#b4a6d2;--dim:#8a7cab;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background-image:radial-gradient(850px 560px at 12% -8%,rgba(124,77,222,.26),transparent 62%);
  background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
.brandbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brandbar .tag{font:800 10.5px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.brandbar .count{margin-left:auto;font-size:12.5px;color:var(--dim)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:33px;line-height:1.14;margin:0 0 8px}
h2{font-family:Georgia,serif;font-size:25px;line-height:1.2;margin:0 0 6px}
.lede{color:var(--mut);font-size:16px;margin:0 0 22px;max-width:52ch}
.search{display:flex;gap:9px;margin-bottom:14px}
input[type=search],input[type=text],textarea,select{width:100%;background:rgba(255,255,255,.06);
  color:var(--fg);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;
  font:16px/1.5 inherit}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7d6fa0}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--purple2);background:rgba(255,255,255,.09)}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--purple);color:#fff;border-radius:11px;padding:13px 20px;font-weight:700}
.btn:hover{background:var(--purple2)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--fg);border:1.5px solid var(--line)}
.btn.sm{padding:10px 15px;font-size:14.5px}
.course{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;
  background:rgba(255,255,255,.035)}
.chead{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--fg);
  padding:15px 17px;text-align:left}
.chead:hover{background:rgba(255,255,255,.05)}
.cnum{font:800 12px inherit;color:var(--ink);background:var(--gold);border-radius:6px;
  padding:3px 7px;flex:0 0 auto}
.cname{font-weight:700;font-size:16.5px}
.cmeta{margin-left:auto;font-size:12.5px;color:var(--dim);flex:0 0 auto}
.clist{display:none;padding:0 10px 10px}
.course.open .clist{display:block}
.row{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:7px;color:var(--fg)}
.row:hover{background:rgba(124,77,222,.22);border-color:var(--purple2)}
.rtitle{font-weight:600;font-size:15.5px}
.rkind{font-size:12px;color:var(--dim);margin-top:2px}
.grp{font:800 10.5px/1 inherit;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin:16px 0 2px;padding:0 3px}
.grp.gold{color:var(--gold);margin-top:22px}
.grpnote{font-size:12.5px;color:var(--dim);margin:0 0 4px;padding:0 3px}
.rcourse{font-size:12px;color:var(--mut);margin-top:3px}
.setup{background:rgba(240,194,75,.1);border:1px solid rgba(240,194,75,.3);
  border-radius:11px;padding:14px 16px;margin:0 0 18px}
.setup b{display:block;color:var(--gold);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:6px}
.setup ol{margin:0;padding-left:19px;color:var(--mut);font-size:14.5px}
label{display:block;font-weight:700;font-size:14.5px;margin:17px 0 3px}
label .h{display:block;font-weight:400;color:var(--dim);font-size:13.5px;margin:2px 0 6px}
.out{background:#120822;border:1px solid var(--line);border-radius:12px;padding:19px;
  font:14px/1.68 "SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap;word-wrap:break-word;
  max-height:50vh;overflow:auto;margin-top:6px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}
.note{color:var(--mut);font-size:14.5px;margin:0 0 18px}
.miss{color:var(--gold);font-size:13.5px;margin:10px 0 0}
.done{color:var(--mint)}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
.pick{display:grid;gap:10px;margin:4px 0 10px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:rgba(255,255,255,.055);border:1.5px solid var(--line);border-radius:12px;
  padding:15px 17px;color:var(--fg);font-size:16px}
.pick button:hover,.pick button.sel{background:rgba(124,77,222,.26);border-color:var(--purple2)}
.winner{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.32);
  border-radius:13px;padding:20px;margin-bottom:14px}
.winner .nm{font-family:Georgia,serif;font-size:27px;margin-bottom:6px}
.alt{color:var(--mut);font-size:14.5px;padding:9px 0;border-top:1px solid var(--line)}
.alt b{color:var(--fg)}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:32px;
  padding-top:15px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(18px);
  background:var(--mint);color:#06281a;font-weight:700;padding:12px 22px;border-radius:30px;
  opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
.screen{display:none}.screen.on{display:block}
@media(max-width:520px){h1{font-size:27px}.wrap{padding:16px 14px 44px}}
@media print{body{background:#fff;color:#000}.bar,.brandbar,.toast{display:none}
  .out{background:#fff;color:#000;border:1px solid #999}}
</style></head><body>
<div class="wrap">
  <div class="brandbar"><span class="tag">AI MADE SIMPLE</span>
    <span class="count" id="count"></span></div>

  <section class="screen on" id="s-home">
    <h1>Prompt Builder</h1>
    <p class="lede">Every prompt from the nineteen courses, as boxes you fill in.
      No brackets to edit. Type your answers, press copy, paste it in.</p>
    <div class="search">
      <input type="search" id="q" placeholder="Search by course or what you need to do">
    </div>
    <div class="bar" style="margin:0 0 18px">
      <button class="btn ghost sm" id="openpick">Which tool do I use?</button>
    </div>
    <div id="list"></div>
  </section>

  <section class="screen" id="s-prompt">
    <div class="bar" style="margin:0 0 16px"><button class="btn ghost sm" id="pback">All prompts</button></div>
    <div class="rkind" id="pcourse"></div>
    <h2 id="ptitle"></h2>
    <p class="note" id="pnote"></p>
    <div class="setup" id="psetup"></div>
    <div id="pfields"></div>
    <h2 style="margin-top:28px">Your prompt</h2>
    <p class="miss" id="pmiss"></p>
    <div class="out" id="pout"></div>
    <div class="bar"><button class="btn" id="pcopy">Copy the prompt</button>
      <button class="btn ghost sm" id="pclear">Clear the boxes</button></div>
  </section>

  <section class="screen" id="s-pick">
    <div class="rkind" id="qstep"></div>
    <h2 id="qtext"></h2>
    <div class="pick" id="qopts"></div>
    <div class="bar"><button class="btn ghost sm" id="qback">Back</button>
      <button class="btn ghost sm" id="qcancel">Cancel</button></div>
  </section>

  <section class="screen" id="s-pickout">
    <h2>Use this one</h2>
    <div id="pickout"></div>
    <div class="bar"><button class="btn ghost sm" id="pickagain">Ask me again</button>
      <button class="btn ghost sm" id="pickhome">All prompts</button></div>
  </section>

  <footer>GetPaidToBeYouOnline</footer>
</div>
<div class="toast" id="toast">Copied</div>
<script>const D={"courses":[{"num":1,"label":"01","name":"What AI Actually Is","group":"SKY","unit":"Start Here"},{"num":2,"label":"02","name":"Claude","group":"LAV","unit":"The Tools"},{"num":3,"label":"03","name":"ChatGPT","group":"LAV","unit":"The Tools"},{"num":4,"label":"04","name":"Gemini","group":"LAV","unit":"The Tools"},{"num":5,"label":"05","name":"Gemini Notebook","group":"LAV","unit":"The Tools"},{"num":6,"label":"06","name":"Perplexity","group":"LAV","unit":"The Tools"},{"num":7,"label":"07","name":"Meta AI","group":"LAV","unit":"The Tools"},{"num":8,"label":"08","name":"Microsoft Copilot","group":"LAV","unit":"The Tools"},{"num":9,"label":"09","name":"DeepSeek","group":"LAV","unit":"The Tools"},{"num":10,"label":"10","name":"AI For Your Daily Life","group":"LAV","unit":"The Tools"},{"num":11,"label":"11","name":"AI For Video Content","group":"GRN","unit":"Content, Study, Family and Safety"},{"num":12,"label":"12","name":"AI For Students","group":"GRN","unit":"Content, Study, Family and Safety"},{"num":13,"label":"13","name":"AI For Parents","group":"GRN","unit":"Content, Study, Family and Safety"},{"num":14,"label":"14","name":"AI, Privacy and Safety","group":"GRN","unit":"Content, Study, Family and Safety"},{"num":15,"label":"15","name":"AI For Your Career Right Now","group":"AMB","unit":"Work and Career"},{"num":16,"label":"16","name":"AI For Job Seekers","group":"AMB","unit":"Work and Career"},{"num":17,"label":"17","name":"AI For Productivity","group":"AMB","unit":"Work and Career"},{"num":18,"label":"18","name":"AI For Business","group":"GOLD","unit":"Business and Money"},{"num":19,"label":"19","name":"AI For Finance","group":"GOLD","unit":"Business and Money"}],"prompts":[{"id":"c01t1","course":1,"title":"Asking AI to explain itself","note":"Run this in Claude, then run it in ChatGPT. The differences in how each one describes itself are a lesson in their own right.","kind":"Course task 1","setup":[],"fields":[],"template":"Explain what you are in plain English. No jargon, and do\nnot assume I know anything about technology.\n\nTell me:\n1. What are you, in one paragraph, as if I had never heard\n   of AI?\n2. How did you learn to do this, and what does that training\n   actually mean in simple terms?\n3. What are you genuinely good at, and what should I not\n   rely on you for?\n4. When you give a wrong answer, why does that happen?\n5. The most important thing to understand about using you\n   responsibly.\n\nBe honest. Do not make yourself sound more capable than you\nare. I want to understand you, not be impressed."},{"id":"c01t2","course":1,"title":"Spotting the AI already around you","note":"You will recognise several from the list in point 1. That recognition is the point. AI is not new to your life, you have just started using it on purpose.","kind":"Course task 2","setup":[],"fields":[],"template":"I want to understand where AI already is in my everyday\nlife without me noticing.\n\nTell me:\n1. Ten everyday apps or services most people use that already\n   use AI, and what the AI is actually doing in each.\n   Keep it to ordinary daily life, not tech companies.\n2. How the AI in those apps differs from the AI I use when I\n   open Claude or ChatGPT.\n3. What it really means when a company says a product is\n   powered by AI, and when that is just marketing.\n4. One thing most people believe about AI that is not true."},{"id":"c01t3","course":1,"title":"Knowing where AI ends and you begin","note":"Save the question from point 4 somewhere you will see it. Asking it before you publish or send anything is the most useful habit this course gives you.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"What I use AI for","hint":"The tasks you use it for, or want to","long":true},{"id":"f1","label":"What I am unsure about","hint":"What feels uncomfortable, honestly","long":true}],"template":"Help me build a personal rule for when to use AI and when\nto rely on my own judgement.\n\nWhat I use AI for: {f0}.\nWhat I am unsure about: {f1}.\n\nGive me:\n1. Tasks where AI is reliable and I can use it without much\n   worry, and why.\n2. Tasks where it is useful but I should check the output,\n   and what to look for.\n3. Tasks where I should not rely on it at all, and why.\n4. The one question to ask myself before acting on anything\n   it produces.\n5. How to explain my use of AI to someone sceptical about it,\n   in one clear paragraph."},{"id":"x01_0","course":1,"title":"Learn something properly in fifteen minutes","note":"Works for anything you have been meaning to understand and never have.","kind":"Ask it to teach you","setup":[],"fields":[{"id":"topic","label":"What you want to understand","hint":"The thing you keep meaning to learn"},{"id":"level","label":"Where you are starting from","hint":"","options":["I know nothing at all","I know the words but not what they mean","I understand the basics","I know a fair bit, I want the next layer"]},{"id":"why","label":"Why you want to know it","hint":"What you would do with it once you understood"},{"id":"time","label":"How long you have","hint":"","options":["Ten minutes","Half an hour","An afternoon"]}],"template":"Teach me {topic}. I have {time} and I want to actually understand it, not\njust be able to repeat it.\n\nWhere I am starting from: {level}\nWhy I want to know: {why}\n\nTeach it like this:\n1. Start with the one idea everything else hangs off. Use a comparison to\n   something ordinary I already understand.\n2. Build up in small steps. After each step, give me one sentence that checks\n   whether I followed it.\n3. Tell me the thing beginners get wrong about this, and why the wrong version\n   is tempting.\n4. Finish with three questions. If I can answer them, I have understood it.\n\nDo not flatter me and do not pad. If I need to know something else first, say\nso and teach me that instead."},{"id":"x01_1","course":1,"title":"Have it argue against you properly","note":"Use this before you commit to something, while it is still cheap to change.","kind":"Ask it to argue back","setup":[],"fields":[{"id":"belief","label":"What you believe","hint":"The thing you are fairly sure about","options":null,"long":true},{"id":"why","label":"Why you believe it","hint":"Your actual reasoning, not the tidy version","options":null,"long":true},{"id":"stake","label":"What is riding on it","hint":"What happens if you are wrong"}],"template":"I want you to argue against me, properly. Do not soften it and do not\nbalance it out at the end.\n\nWhat I believe: {belief}\nWhy I believe it: {why}\nWhat is riding on it: {stake}\n\nDo this:\n1. Give me the strongest case against my position. Not the obvious objection,\n   the one that would actually worry me.\n2. Name the assumption I am making that I have not noticed I am making.\n3. Tell me what I would need to see to know I was wrong.\n4. Then say honestly whether, having argued against it, you think I am right.\n\nIf my reasoning is sound, say so plainly rather than inventing an objection."},{"id":"x01_2","course":1,"title":"Translate it, and keep the meaning","note":"For anything going to someone who reads a different language or works at a different level.","kind":"Ask it to translate","setup":[],"fields":[{"id":"text","label":"The text","hint":"Paste what you need translating","options":null,"long":true},{"id":"lang","label":"Into what","hint":"Such as French, Gujarati, or plain English for a ten year old"},{"id":"who","label":"Who will read it","hint":"So the tone comes out right"},{"id":"keep","label":"What must not change","hint":"Such as dates, prices, names, or the warm tone"}],"template":"Translate this into {lang}.\n\nThe text:\n{text}\n\nWho will read it: {who}\nWhat must come through unchanged: {keep}\n\nGive me:\n1. The translation, written the way a person actually speaks it, not word for\n   word.\n2. Anything that does not translate cleanly, and what you did instead.\n3. A note on anything that might read as rude or odd to that reader, even\n   though it is fine in the original."},{"id":"x01_3","course":1,"title":"Find the thing you have not thought of","note":"Run this before you start, not after it goes wrong.","kind":"Ask what you are missing","setup":[],"fields":[{"id":"plan","label":"What you are planning","hint":"Describe it the way you would to a friend","options":null,"long":true},{"id":"done","label":"What you have already thought about","hint":"So it does not tell you things you know","options":null,"long":true},{"id":"worst","label":"What would hurt most if it went wrong","hint":""}],"template":"Here is what I am planning. Tell me what I have not thought of.\n\nThe plan: {plan}\nWhat I have already considered: {done}\nWhat would hurt most if it went wrong: {worst}\n\nGive me:\n1. The three things most likely to go wrong that are not on my list.\n2. For each one, how likely it is and what it would cost me.\n3. The one I should deal with first, and the smallest thing I could do this\n   week to deal with it.\n4. Anything I am worrying about that does not deserve the worry.\n\nDo not repeat things I said I had already considered."},{"id":"c02t1","course":2,"title":"Writing content in your voice","note":"Replace every bracket with real, specific details. Vague input produces vague output, and the more you tell it, the less editing you do.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Your specific topic","hint":""},{"id":"f1","label":"Your audience","hint":"Who they are and what they care about","long":true},{"id":"f2","label":"My brand tone","hint":"How you write, such as warm and direct, conversational, no jargon, British spelling","long":true},{"id":"f3","label":"Your topic for this week","hint":""}],"template":"I create content about {f0} for {f1}.\n\nMy brand tone: {f2}.\n\nWrite 5 social media posts about {f3}.\nEach post must:\n- Open with a line that makes someone stop scrolling\n- Stay under 150 words\n- Sound like a real person, not a brand announcement\n- End with a question or a clear next step\n\nNo preamble before the first post. Just write the 5 posts."},{"id":"c02t2","course":2,"title":"Building a digital product","note":"This works best inside a Claude Project with your context already in the project instructions. Set that up first using the steps on the next slide.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Product idea","hint":"What it is, what format, what problem it solves","long":true},{"id":"f1","label":"My audience","hint":"Your buyer, described specifically","long":true},{"id":"f2","label":"My brand tone","hint":"How you write"}],"template":"I want to create a digital product to sell online.\n\nProduct idea: {f0}.\nMy audience: {f1}.\nMy brand tone: {f2}.\n\nComplete all four steps in order, showing the full output of\neach before moving on:\n\nStep 1. Validate: is there genuine demand? What is the single\nbiggest risk? Be honest rather than encouraging.\n\nStep 2. Outline: every section with one line on what it covers.\n\nStep 3. Write the full content for every section. Practical and\nspecific. Every section gives the reader something to do or know.\n\nStep 4. Listing: a title under 12 words, a two sentence hook,\nfive bullets starting with verbs, and one closing line."},{"id":"c02t3","course":2,"title":"Making a decision","note":"Write your real situation in the brackets, not a tidied version. It gives better answers when you are honest about what is making this hard.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"The decision","hint":"Exactly what you are choosing between","long":true},{"id":"f1","label":"What makes this hard","hint":"The specific thing keeping you stuck, not just that you are unsure","long":true},{"id":"f2","label":"What matters most to me","hint":"Two or three priorities, such as stability, time, income, or impact","long":true},{"id":"f3","label":"What I have already considered","hint":"What you have thought about, even if it feels incomplete","long":true}],"template":"I need to make a decision and I keep going back and forth.\n\nThe decision: {f0}.\nWhat makes this hard: {f1}.\nWhat matters most to me: {f2}.\nWhat I have already considered: {f3}.\n\nThink this through carefully before you answer. Then tell me:\n1. What I am actually choosing between, underneath the surface\n2. What I might be underweighting\n3. Your clear recommendation and the single strongest reason"},{"id":"x02_44","course":2,"title":"Write something long and edit it in place","note":"Anything long enough to need editing opens in its own panel beside the chat.","kind":"Artifacts","setup":["Anything long enough opens in its own panel automatically. Keep it open and edit there rather than asking for a fresh copy each time."],"fields":[{"id":"what","label":"What you are writing","hint":"","options":["A blog post","A letter","A guide or how-to","A script","A policy or procedure"]},{"id":"about","label":"What it is about","hint":"Be specific","options":null,"long":true},{"id":"who","label":"Who will read it","hint":""},{"id":"length","label":"Roughly how long","hint":""}],"template":"Write {what} about {about}.\n\nWho will read it: {who}\nRoughly how long: {length}\n\nPut it in a document I can edit rather than in the chat.\n\nWrite a complete first draft, not an outline. Then stop and ask me what to\nchange, one question at a time, and make each change in the document rather\nthan writing it out again underneath."},{"id":"x02_45","course":2,"title":"Ask questions about a document you already have","note":"A PDF, a spreadsheet, a photo or a screenshot.","kind":"File uploads","setup":["Attach the file to your message before you send this."],"fields":[{"id":"kind","label":"What you are uploading","hint":"","options":["A PDF","A spreadsheet","A photo","A screenshot","Several documents"]},{"id":"want","label":"What you need to know from it","hint":"The actual question, not just summarise it","options":null,"long":true},{"id":"why","label":"What you will do with the answer","hint":""}],"template":"I have uploaded {kind}. I need to know this: {want}\n\nWhat I will do with the answer: {why}\n\nPlease:\n1. Answer my question directly, first, before any summary.\n2. Quote the part of the document the answer comes from, so I can check it.\n3. Tell me anything in there that is relevant to what I am doing that I did\n   not ask about.\n4. Say plainly if the answer is not in the document, rather than filling the\n   gap from general knowledge."},{"id":"x02_46","course":2,"title":"Turn a description into something that looks designed","note":"Slides, a one-pager, a mockup, a landing page, from a written description.","kind":"Claude Design","setup":[],"fields":[{"id":"what","label":"What you need","hint":"","options":["A set of slides","A one-page document","A landing page","A mockup of an idea"]},{"id":"about","label":"What it is for and what it needs to say","hint":"","options":null,"long":true},{"id":"audience","label":"Who sees it","hint":""},{"id":"look","label":"How it should look","hint":"Such as clean and plain, warm, serious, colourful"}],"template":"Make me {what}.\n\nWhat it is for and what it needs to say: {about}\nWho sees it: {audience}\nHow it should look: {look}\n\nUse my words rather than filling it with placeholder text. If something is\nmissing that it genuinely needs, ask me for that one thing rather than\ninventing it.\n\nKeep the amount of text on each part realistic for something people actually\nread."},{"id":"x02_47","course":2,"title":"Hand over a longer job and come back to it","note":"For work that takes a while, where you do not want to sit watching.","kind":"Cowork and Docs","setup":[],"fields":[{"id":"job","label":"The job","hint":"What you want done, in full","options":null,"long":true},{"id":"done","label":"What finished looks like","hint":"So it knows when to stop"},{"id":"constraints","label":"Anything it must or must not do","hint":""}],"template":"Here is a longer piece of work I would like you to do on your own.\n\nThe job: {job}\nWhat finished looks like: {done}\nWhat you must or must not do: {constraints}\n\nBefore you start, tell me:\n- How you intend to approach it, in three or four steps.\n- Anything you need from me first.\n- Anything in the brief that is ambiguous, and the reading you will go with.\n\nThen do the whole thing. When you have finished, tell me what you were least\nsure about and what I should check first."},{"id":"c03t1","course":3,"title":"Generating images for everyday life","note":"Describe your image and ChatGPT will offer to generate it. If the first attempt is wrong, say what to change rather than starting again.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Exactly what you want to see","hint":"The subject, the setting, and what is happening","long":true},{"id":"f1","label":"Style","hint":"Pick the closest","options":["Photorealistic","Illustration","Watercolour","Flat design","Cartoon","Minimal","Vintage"]},{"id":"f2","label":"Colours","hint":"The palette, such as warm earth tones, soft pastels, or white and gold","long":true},{"id":"f3","label":"Mood","hint":"Pick the closest","options":["Calm and cosy","Energetic","Clean and professional"]},{"id":"f4","label":"Shape","hint":"Pick the closest","options":["Square","Landscape","Portrait"]},{"id":"f5","label":"Anything specific","hint":"Pick the closest","options":["No text in the image","Include a person","No people","Outdoors"]}],"template":"Generate an image of {f0}.\n\nStyle: {f1}.\nColours: {f2}.\nMood: {f3}.\nShape: {f4}.\n\nAnything specific: {f5}.\n\nExample: a cosy kitchen table with a cup of tea, a notebook,\nand autumn leaves outside the window. Watercolour. Warm\norange and brown. Calm and inviting."},{"id":"c03t2","course":3,"title":"Writing a product description","note":"Test all three. Run the same product with a different description each week and see which gets the most interest. Problem led usually wins.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Product","hint":"Name"},{"id":"f1","label":"What it is","hint":"Format and what it contains, in one sentence","long":true},{"id":"f2","label":"What it delivers","hint":"The specific result the buyer gets","long":true},{"id":"f3","label":"Who it is for","hint":"The specific person who would buy it","long":true}],"template":"Write 3 different descriptions for my digital product.\n\nProduct: {f0}.\nWhat it is: {f1}.\nWhat it delivers: {f2}.\nWho it is for: {f3}.\n\nWrite three versions with different angles:\nVersion 1, outcome led: opens with the result, not the product.\nUnder 80 words.\nVersion 2, problem led: opens with the frustration they have\nbefore they find it. Under 80 words.\nVersion 3, story led: opens with a moment they will recognise.\nUnder 80 words.\n\nNo hype. Each should sound like a person wrote it for one\nspecific buyer."},{"id":"c03t3","course":3,"title":"Writing a launch post or email","note":"Use Version A for Threads and Instagram, Version B for email and Facebook. Replace the link placeholder before you publish.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Email","Instagram post","Threads post","Facebook post"]},{"id":"f1","label":"Product","hint":"Name"},{"id":"f2","label":"What it does","hint":"The result it delivers, in one sentence","long":true},{"id":"f3","label":"Who it is for","hint":"Your buyer"},{"id":"f4","label":"The problem it solves","hint":"What they feel before buying"},{"id":"f5","label":"My tone","hint":"Pick the closest","options":["Warm","Direct","Conversational","Personal"]}],"template":"Write a launch {f0} for my digital product.\n\nProduct: {f1}.\nWhat it does: {f2}.\nWho it is for: {f3}.\nThe problem it solves: {f4}.\nMy tone: {f5}.\n\nWrite two versions:\n\nVersion A, short. Under 100 words. Opens with the problem.\nIntroduces the product in two sentences. Link at the end.\n\nVersion B, story led. Under 200 words. Opens with a scene they\nrecognise. Builds to the product. Link at the end.\n\nDo not open either with \"Are you\" or \"Have you\". No fake\nurgency and no exclamation marks in every sentence."},{"id":"x03_48","course":3,"title":"Tell it something worth remembering","note":"What it knows about you between conversations, set deliberately rather than by accident.","kind":"Memory","setup":["Check what it already has stored about you first, and clear out anything no longer true."],"fields":[{"id":"remember","label":"What it should remember about you","hint":"The things you keep having to repeat","options":null,"long":true},{"id":"why","label":"Why it matters","hint":"How it should change the answers"}],"template":"Please remember this about me, so I stop repeating it:\n\n{remember}\n\nWhy it matters: {why}\n\nThen tell me, in a short list, what you now have stored about me, so I can see\nwhether any of it is wrong or out of date."},{"id":"x03_49","course":3,"title":"Think something through out loud","note":"Speaking is faster than typing, and you can interrupt.","kind":"Voice mode","setup":["Switch to voice before you send this, and read it out rather than pasting it."],"fields":[{"id":"about","label":"What you want to think through","hint":"","options":null,"long":true},{"id":"role","label":"What you want it to do","hint":"","options":["Ask me questions until it is clear","Let me talk, then summarise","Argue with me","Just listen and keep me going"]}],"template":"I want to think out loud about something. {role}.\n\nWhat I am thinking about: {about}\n\nKeep your turns short so this feels like a conversation rather than a lecture.\nAsk one question at a time. Do not summarise until I say I am finished.\n\nAt the end, give me the three things I said that mattered most, in my own\nwords."},{"id":"x03_50","course":3,"title":"Work on one document instead of a chat full of versions","note":"Side by side editing, so edits happen in the text rather than underneath it.","kind":"Canvas","setup":["Open Canvas before you paste this."],"fields":[{"id":"what","label":"What you are writing","hint":""},{"id":"about","label":"What it needs to say","hint":"","options":null,"long":true},{"id":"who","label":"Who it is for","hint":""},{"id":"stage","label":"Where you are up to","hint":"","options":["Starting from nothing","I have a rough draft","I have something nearly finished"]}],"template":"Open this in Canvas and let us work on it together.\n\nWhat I am writing: {what}\nWhat it needs to say: {about}\nWho it is for: {who}\nWhere I am up to: {stage}\n\nWrite the draft in the document. Then wait for me. When I ask for a change,\nchange it in the document rather than posting a new version in the chat, and\ntell me in one line what you changed."},{"id":"x03_51","course":3,"title":"Hand over a job with several steps","note":"Multi-step work it carries out itself, and video from a description.","kind":"Sora and agent mode","setup":[],"fields":[{"id":"job","label":"What you want done","hint":"Describe the whole thing, including the end result","options":null,"long":true},{"id":"steps","label":"Anything that must happen in a particular order","hint":""},{"id":"stop","label":"When it should stop and check with you","hint":""}],"template":"Here is a job with several steps. Please work through it.\n\nWhat I want done: {job}\nWhat must happen in order: {steps}\nWhen to stop and check with me: {stop}\n\nBefore starting, list the steps you plan to take and tell me if any of them\nneed something from me.\n\nWork through them in order. Tell me when each is done. If one fails or you\ncannot do it, stop and say so rather than working around it quietly."},{"id":"c04t1","course":4,"title":"Writing a first draft in Canvas","note":"Click Canvas first or the draft arrives as a chat message you have to copy out. Edit directly in the Canvas, then paste the finished piece into Google Docs.","kind":"Course task 1","setup":["Click Canvas in the message box before you paste this"],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Email","Social post","Product description","Lesson","Newsletter","Plan"]},{"id":"f1","label":"Topic","hint":"What this is about, specifically","long":true},{"id":"f2","label":"Who will read it","hint":"The person or people"},{"id":"f3","label":"Tone","hint":"Pick the closest","options":["Friendly","Professional","Warm","Direct"]},{"id":"f4","label":"Point 1","hint":""},{"id":"f5","label":"Point 2","hint":""},{"id":"f6","label":"Point 3","hint":""},{"id":"f7","label":"Length","hint":"Pick the closest","options":["Under 150 words","250 to 350 words","Full document"]}],"template":"\n\nWrite a complete {f0}.\n\nTopic: {f1}.\nWho will read it: {f2}.\nTone: {f3}.\nKey points to include:\n- {f4}\n- {f5}\n- {f6}\nLength: {f7}.\n\nWrite it in full, with no placeholder text and no instruction\nsentences left in. Ready to use with light editing."},{"id":"c04t2","course":4,"title":"Summarising something long","note":"Paste the text into gemini.google.com. The Gemini panel inside Gmail does the same job automatically, but that panel needs a paid plan.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Here is something long I need to understand quickly","hint":"Paste the full email thread, document or article here","long":true},{"id":"f1","label":"My tone","hint":"Pick the closest","options":["Professional","Friendly","Direct"]}],"template":"Here is something long I need to understand quickly:\n\n{f0}\n\nTell me:\n1. What is the main point or request?\n2. What has been agreed or decided so far?\n3. What action is needed from me, and by when?\n4. Anything I should be careful about or look at twice.\n\nThen draft a reply that addresses the main point, stays warm\nbut under 100 words, and ends with a clear next step.\n\nMy tone: {f1}."},{"id":"c04t3","course":4,"title":"Research with current sources","note":"Do this at gemini.google.com rather than inside a document. The browser version searches the web properly and will tell you when it is unsure.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Your topic or question","hint":""},{"id":"f1","label":"Who you are and why this matters to you","hint":"Such as someone selling digital products, running a small business, or weighing up a specific decision","long":true}],"template":"Research {f0} and give me something\nI can actually use.\n\nI want to know:\n1. What is the current situation with this?\n2. What are the three most important things someone in my\n   position should know right now?\n3. What has changed about this in the last year?\n\nMy context: I am {f1}.\n\nUse current sources where you can, and tell me plainly if\nsomething you are saying might be out of date."},{"id":"x04_52","course":4,"title":"Get a proper report instead of a quick answer","note":"It reads across many sources and writes up what it found. Takes a few minutes.","kind":"Deep Research","setup":["Switch Deep Research on before sending, and expect to wait a few minutes."],"fields":[{"id":"question","label":"The question you want answered","hint":"Make it a real question, not a topic","options":null,"long":true},{"id":"use","label":"What you will do with it","hint":""},{"id":"scope","label":"What to include and what to leave out","hint":""},{"id":"form","label":"How you want it back","hint":"","options":["A written report","A comparison of options","A list of findings with sources","A briefing I could hand to someone"]}],"template":"Research this properly for me.\n\nThe question: {question}\nWhat I will do with it: {use}\nWhat to include and leave out: {scope}\nHow I want it back: {form}\n\nPlease:\n- Say where each significant claim came from.\n- Where sources disagree, say so and tell me which is better supported rather\n  than averaging them.\n- Separate what is established from what is contested or recent.\n- Tell me what you could not find out, rather than filling it in.\n\nFinish with the three things that matter most for what I am doing."},{"id":"x04_53","course":4,"title":"Talk it through rather than type it","note":"A spoken conversation you can interrupt and redirect.","kind":"Gemini Live","setup":["Start Gemini Live before you say this, rather than typing it."],"fields":[{"id":"about","label":"What you want to talk through","hint":"","options":null,"long":true},{"id":"want","label":"What you want out of it","hint":"","options":["To make a decision","To understand something","To practise saying it","To stop going round in circles"]}],"template":"I want to talk this through out loud. What I want out of it: {want}\n\nWhat it is about: {about}\n\nKeep your answers short so I can interrupt. Ask me one question at a time. Do\nnot give me a list unless I ask for one, because I cannot hold a list in my\nhead while talking.\n\nWhen I say I am done, tell me what I decided, in one or two sentences."},{"id":"x04_54","course":4,"title":"Make a picture and keep adjusting it","note":"Pictures from a description, in the same conversation, so you can keep changing it.","kind":"Image generation","setup":[],"fields":[{"id":"what","label":"What the picture is of","hint":"","options":null,"long":true},{"id":"use","label":"What it is for","hint":"Such as a social post, a header, an illustration in a guide"},{"id":"style","label":"How it should look","hint":"Such as a photograph, an illustration, flat and simple"},{"id":"avoid","label":"What to avoid","hint":"Such as text in the image, people's faces, anything cluttered"}],"template":"Make me a picture.\n\nWhat it is of: {what}\nWhat it is for: {use}\nHow it should look: {style}\nWhat to avoid: {avoid}\n\nMake one version first. Then I will tell you what to change, and I would like\nyou to adjust that version rather than start again, so it stays recognisably\nthe same picture.\n\nIf what I have asked for will not work well as an image, say so before you\nmake it."},{"id":"x04_55","course":4,"title":"Work on the document you already have open","note":"It reads the document or email in front of you rather than a copy.","kind":"The Workspace panel","setup":["Open the document or email first, then open the panel beside it."],"fields":[{"id":"doc","label":"What you have open","hint":"Such as a long email thread, a document, a spreadsheet"},{"id":"want","label":"What you need from it","hint":"","options":null,"long":true},{"id":"form","label":"How you want the answer","hint":"","options":["A short summary","The actions and who owns them","A reply I can send","The numbers that matter"]}],"template":"Using the {doc} I have open:\n\n{want}\n\nGive it to me as: {form}\n\nWork only from what is actually in this document. If something I am asking\nabout is not in it, say so rather than answering from general knowledge.\nQuote the lines you based the answer on."},{"id":"c05t1","course":5,"title":"Understanding something you already own","note":"The third question is the one that matters. Most material is written for a situation slightly unlike yours, and it never says so.","kind":"Course task 1","setup":["Upload your document first, then paste this"],"fields":[],"template":"\n\nUsing only the sources I have uploaded, and no outside\nknowledge, tell me:\n\n1. The 5 most important ideas in this material.\n2. What it actually tells me to do, in order.\n3. What it assumes about the reader that might not be\n   true for me.\n4. What it leaves unanswered.\n\nGive me the citation for each point so I can check it."},{"id":"c05t2","course":5,"title":"Turning your own material into something useful","note":"Question two usually finds your best material. It is the thing you assume is obvious, which is exactly what other people need explaining.","kind":"Course task 2","setup":["Upload your own notes, transcripts or past writing"],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Flashcards","A quiz","A summary","10 post ideas"]}],"template":"\n\nThese are my own words. Using only them:\n\n1. What ideas do I come back to most often?\n2. What do I say that I have never properly explained?\n3. Turn this into {f0}, using my own phrasing where it works.\n4. What is missing that I clearly assume people know?\n\nDo not add anything that is not in my sources."},{"id":"c05t3","course":5,"title":"Comparing several sources at once","note":"The question nobody answers is often the most useful thing you will find. It is where you are allowed your own view.","kind":"Course task 3","setup":["Upload 3 to 5 sources on the same subject"],"fields":[],"template":"\n\nCompare these for me, using only what is in them:\n\n1. Where do they agree?\n2. Where do they contradict each other? Quote both sides.\n3. What does each one assume about the reader?\n4. What question does none of them answer?\n\nCite every point so I can see which source said what."},{"id":"x05_56","course":5,"title":"Turn your reading into something you can listen to","note":"Your sources become a spoken conversation between two voices.","kind":"Audio overviews","setup":["Upload your sources first, then generate the audio overview."],"fields":[{"id":"sources","label":"What you have uploaded","hint":""},{"id":"focus","label":"What you want them to concentrate on","hint":"The part you actually need"},{"id":"level","label":"Who you are listening as","hint":"","options":["I know nothing about this","I know the basics","I know it well, I want the detail"]}],"template":"Make an audio overview of what I have uploaded.\n\nWhat the sources are: {sources}\nConcentrate on: {focus}\nWhere I am starting from: {level}\n\nSpend most of it on {focus} rather than giving equal time to everything. Skip\nthe background I already know. Where the sources disagree, say so out loud\nrather than smoothing it over."},{"id":"x05_57","course":5,"title":"Get a narrated walkthrough of your material","note":"Useful when the material is visual, or you want it explained rather than read.","kind":"Video overviews","setup":["Upload your sources first."],"fields":[{"id":"sources","label":"What you have uploaded","hint":""},{"id":"explain","label":"What needs explaining most","hint":"The part that will not go in"},{"id":"for","label":"What it is for","hint":"","options":["Understanding it myself","Revising it","Explaining it to someone else"]}],"template":"Make a video overview of my sources.\n\nWhat they are: {sources}\nWhat needs explaining most: {explain}\nWhat it is for: {for}\n\nLead with {explain} rather than working through the sources in order. Use the\ndiagrams and figures in the material where they help. Keep it to what is\nactually in my sources."},{"id":"x05_58","course":5,"title":"See the shape of an argument","note":"Your sources laid out as a diagram, which shows what connects to what.","kind":"Mind maps","setup":["Upload your sources first."],"fields":[{"id":"sources","label":"What you have uploaded","hint":""},{"id":"question","label":"What you are trying to see","hint":"Such as how the parts relate, or where the argument is weak"}],"template":"Lay my sources out as a mind map.\n\nWhat they are: {sources}\nWhat I am trying to see: {question}\n\nThen, in writing underneath:\n1. The two or three ideas everything else hangs off.\n2. Anything that appears in several sources in different words.\n3. Where the connections are thin, meaning a claim that nothing else supports."},{"id":"x05_59","course":5,"title":"Be tested on what you uploaded","note":"Turning the material into questions is the part that makes it stick.","kind":"Flashcards and quizzes","setup":["Upload your sources first."],"fields":[{"id":"sources","label":"What you have uploaded","hint":""},{"id":"why","label":"What you are preparing for","hint":""},{"id":"hard","label":"How hard","hint":"","options":["Straightforward recall","Make me explain why","Hard, apply it to new situations"]}],"template":"Turn my sources into questions.\n\nWhat they are: {sources}\nWhat I am preparing for: {why}\nHow hard: {hard}\n\nGive me the questions first with no answers, then the answers below, each with\none line on what I needed to understand to get it.\n\nOnly use what is in my sources. If something important for {why} is missing\nfrom them, tell me at the end."},{"id":"c06t1","course":6,"title":"Research you can verify","note":"Click at least three citations after reading. If a source looks thin, ask a follow-up for better sourcing on that specific point.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Your question","hint":"Written the way you would ask a knowledgeable friend","long":true}],"template":"I want to understand {f0}.\n\nTell me:\n1. What is the current situation with this?\n2. The three most important things to know about it.\n3. What has changed in the last year.\n4. One thing most people get wrong about this.\n\nUse sources from the last 12 months where you can.\nCite every significant claim so I can check the important\npoints myself."},{"id":"c06t2","course":6,"title":"Checking your facts before you publish","note":"Do this before publishing anything with a statistic, a date or a factual claim in it. One wrong fact in public is harder to undo than two minutes of checking.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Paste the first specific claim","hint":"","long":true},{"id":"f1","label":"Paste the second","hint":"","long":true},{"id":"f2","label":"Paste the third","hint":"","long":true}],"template":"I have written something that makes these claims.\nCheck each one and tell me whether it holds up, with a\ncitation for each verdict.\n\nClaims to check:\n1. {f0}\n2. {f1}\n3. {f2}\n\nFor each one tell me:\n- Accurate, out of date, wrong, or cannot be verified\n- What the correct current information is, if it needs updating\n- The source, so I can check it myself"},{"id":"c06t3","course":6,"title":"Testing a product idea","note":"Run this before you build. If it cannot find people talking about the problem, your buyers may not be looking for a solution yet.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Your idea and the problem it solves","hint":"","long":true},{"id":"f1","label":"My buyer","hint":"Who they are and what they struggle with now","long":true}],"template":"I am thinking about making a digital product about\n{f0}.\n\nMy buyer: {f1}.\n\nResearch this and cite everything:\n1. Is there evidence people are actively looking for a solution\n   to this right now? What does the conversation look like?\n2. What already exists, what does it offer, and what does it\n   miss?\n3. What are buyers saying in reviews of similar products, both\n   what they like and what they wish was different?\n4. Does the demand look real enough to justify building this?\n\nWhere the evidence is thin, say so rather than filling the gap."},{"id":"x06_60","course":6,"title":"Ask about the page you are looking at","note":"It reads the page you are on rather than searching for it again.","kind":"Comet browser","setup":["Open the page first, then ask from inside the browser."],"fields":[{"id":"page","label":"What the page is","hint":"Such as a long article, a product listing, a terms page"},{"id":"want","label":"What you want to know from it","hint":"","options":null,"long":true},{"id":"why","label":"What you are deciding","hint":""}],"template":"Looking at this page:\n\n{want}\n\nWhat the page is: {page}\nWhat I am deciding: {why}\n\nAnswer from what is actually on this page. Quote the lines you used. If the\npage does not say, tell me it does not say rather than answering from\nelsewhere, and tell me what would answer it."},{"id":"x06_61","course":6,"title":"A proper report with the sources shown","note":"It reads dozens of sources before writing. Takes a few minutes.","kind":"Deep Research","setup":["Switch Deep Research on first, and expect to wait a few minutes."],"fields":[{"id":"question","label":"The question","hint":"A real question, not a topic","options":null,"long":true},{"id":"use","label":"What you will do with it","hint":""},{"id":"depth","label":"What you need","hint":"","options":["The short answer with evidence","A full report","A comparison of the options","What the disagreement actually is"]}],"template":"Research this properly: {question}\n\nWhat I will do with it: {use}\nWhat I need: {depth}\n\nPlease:\n- Cite the source for every significant claim.\n- Where sources disagree, set out the disagreement rather than averaging it.\n- Flag anything where the evidence is thin or the source has an interest.\n- Separate what is settled from what is still argued about.\n\nEnd with what you could not establish."},{"id":"x06_62","course":6,"title":"Keep one piece of research together","note":"Everything on one subject in one place instead of scattered across old chats.","kind":"Projects","setup":["Set up a project for this subject and work inside it, so the material stays together."],"fields":[{"id":"subject","label":"What the research is about","hint":""},{"id":"goal","label":"What you are trying to end up with","hint":""},{"id":"known","label":"What you have already found","hint":"So it does not repeat it","options":null,"long":true}],"template":"I am building up research on one subject and I want to keep it together.\n\nThe subject: {subject}\nWhat I am trying to end up with: {goal}\nWhat I have found already: {known}\n\nPlease:\n1. Tell me what is still missing between what I have and what I need.\n2. Give me the three questions to research next, in order.\n3. Say which of what I already have is weakest and worth checking again.\n\nAs we go, keep track of what we have covered so I do not go round twice."},{"id":"x06_63","course":6,"title":"Get a longer build, or several opinions","note":"Dashboards and decks from a brief, and several models answering the same question.","kind":"Labs and Model Council","setup":["This takes longer than an ordinary answer. Start it and come back."],"fields":[{"id":"want","label":"What you want built or answered","hint":"","options":null,"long":true},{"id":"form","label":"What it should come back as","hint":"","options":["A dashboard","A set of slides","A written comparison","Several opinions on the same question"]},{"id":"matters","label":"What matters most in the answer","hint":""}],"template":"{want}\n\nWhat it should come back as: {form}\nWhat matters most: {matters}\n\nIf several models answer this, do not just give me the consensus. Tell me\nwhere they disagreed and what the disagreement was actually about, because\nthat is usually the part worth knowing.\n\nSay plainly which parts of the answer are well supported and which are a\njudgement call."},{"id":"c07t1","course":7,"title":"Writing captions inside Instagram","note":"Keep the captions you do not use. One that does not suit this post often fits the next one perfectly.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"What the image or video shows","hint":"And what you want people to feel","long":true},{"id":"f1","label":"My audience","hint":"Who follows you and what they respond to","long":true},{"id":"f2","label":"My tone","hint":"Pick the closest","options":["Friendly","Motivating","Educational","Personal story","Funny"]},{"id":"f3","label":"Goal","hint":"Pick the closest","options":["Comments","Saves","Clicks to my link","Starting a conversation"]}],"template":"Write 3 Instagram captions for a post about {f0}.\n\nMy audience: {f1}.\nMy tone: {f2}.\nGoal: {f3}.\n\nEach caption must:\n- Open with one line that stops the scroll\n- Stay under 150 words\n- Sound like a real person, not a scheduled brand post\n- End with a question or a clear next step"},{"id":"c07t2","course":7,"title":"Drafting replies in WhatsApp","note":"Describe the situation rather than pasting the message itself. Never put another person's private details into any AI tool.","kind":"Course task 2","setup":["Start a chat with Meta AI from your WhatsApp chat list"],"fields":[{"id":"f0","label":"What they asked","hint":"Describe it"},{"id":"f1","label":"Who they are","hint":"Pick the closest","options":["A customer","A buyer","A collaborator","A friend"]},{"id":"f2","label":"What I want to achieve","hint":"Pick the closest","options":["Answer the question","Say no politely","Set a limit","Confirm something","Follow up"]},{"id":"f3","label":"My tone","hint":"Pick the closest","options":["Warm and professional","Casual","Direct and brief"]}],"template":"\n\nHelp me reply to a message. Here is the situation, with no\nnames or private details:\n\nWhat they asked: {f0}.\nWho they are: {f1}.\nWhat I want to achieve: {f2}.\nMy tone: {f3}.\n\nWrite two versions:\nVersion 1, short and direct, under 50 words.\nVersion 2, warmer and fuller, under 100 words.\n\nNo greeting in either. Just the body of the message."},{"id":"c07t3","course":7,"title":"Making an image for a post","note":"Starting with the word Imagine is what triggers image generation. Be specific about style and colour, because vague prompts give generic results.","kind":"Course task 3","setup":["Tap the search bar in Instagram, tap Ask Meta AI, then start your message with the word Imagine"],"fields":[{"id":"f0","label":"Imagine","hint":"The image you want: the subject, the setting, the style and the mood","long":true},{"id":"f1","label":"Style","hint":"Pick the closest","options":["Photorealistic","Illustrated","Flat design","3D","Watercolour","Minimal"]},{"id":"f2","label":"Colours","hint":"The palette you want"},{"id":"f3","label":"Mood","hint":"Pick the closest","options":["Calm","Energetic","Professional","Playful"]}],"template":"\n\nImagine: {f0}.\n\nStyle: {f1}.\nColours: {f2}.\nMood: {f3}.\nNo text in the image.\n\nExample: Imagine a flat design illustration of a woman at a\ndesk with a laptop, surrounded by plants. Warm purple and\ngold. Minimal and modern."},{"id":"x07_64","course":7,"title":"Make a picture inside the app you are already in","note":"Start the message with the word Imagine.","kind":"Image generation","setup":["Begin the message with the word Imagine, which is what tells it to make a picture."],"fields":[{"id":"what","label":"What the picture is of","hint":"","options":null,"long":true},{"id":"use","label":"Where it is going","hint":"Such as a story, a post, a message to a friend"},{"id":"style","label":"How it should look","hint":""}],"template":"Imagine {what}\n\nHow it should look: {style}\nWhere it is going: {use}\n\nMake one, then I will tell you what to change."},{"id":"x07_65","course":7,"title":"Use it where the conversation already is","note":"The same assistant inside the apps you already have open.","kind":"In every Meta app","setup":["Start a chat with Meta AI from your chat list, or mention it inside a group chat."],"fields":[{"id":"context","label":"What you are in the middle of","hint":"Such as a group chat about a weekend away"},{"id":"want","label":"What you need","hint":"","options":null,"long":true},{"id":"tone","label":"How it should sound","hint":"Such as casual, like a normal message"}],"template":"{want}\n\nWhat I am in the middle of: {context}\nHow it should sound: {tone}\n\nKeep it short enough to send as a message rather than read as a document. No\nheadings, no bullet points, nothing that looks like it was written by a\nmachine."},{"id":"x07_66","course":7,"title":"Talk to it instead of typing","note":"Where your country and app version support it.","kind":"Voice conversations","setup":["Start a voice conversation in the app before you say this."],"fields":[{"id":"about","label":"What you want to talk about","hint":"","options":null,"long":true},{"id":"want","label":"What you want from it","hint":"","options":["An answer","To think it through","Company while I work something out"]}],"template":"I want to talk rather than type. What I want from this: {want}\n\nWhat it is about: {about}\n\nKeep your answers short and conversational. Ask me one question at a time.\nNothing that would be a list if it were written down."},{"id":"x07_67","course":7,"title":"Send a photo and ask what is in it","note":"What it says, what it is, or what you could do with it.","kind":"Ask about a photo","setup":["Attach the photo to the message before you send this."],"fields":[{"id":"want","label":"What you want to know about the photo","hint":"","options":null,"long":true},{"id":"why","label":"Why you are asking","hint":"Such as I cannot read the label, or I want to know what plant this is"}],"template":"I have sent you a photo. {want}\n\nWhy I am asking: {why}\n\nTell me what you can actually see, and say plainly if the picture is not clear\nenough to be sure. If you are guessing, say that it is a guess."},{"id":"c08t1","course":8,"title":"Writing any document or email","note":"Draft it here and paste the finished text into Word yourself. Always add one specific personal sentence before you send anything it writes.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Email","Letter","Report section","Proposal","Plan","Meeting agenda"]},{"id":"f1","label":"Purpose","hint":"What it must achieve, specifically","long":true},{"id":"f2","label":"Who will read it","hint":"Their role and what they care about","long":true},{"id":"f3","label":"Tone","hint":"Pick the closest","options":["Professional","Warm","Direct","Formal","Friendly"]},{"id":"f4","label":"Point 1","hint":""},{"id":"f5","label":"Point 2","hint":""},{"id":"f6","label":"Point 3","hint":""},{"id":"f7","label":"Length","hint":"Pick the closest","options":["Under 150 words","250 to 400 words","Full document"]}],"template":"Write a complete {f0}.\n\nPurpose: {f1}.\nWho will read it: {f2}.\nTone: {f3}.\nKey points to cover:\n- {f4}\n- {f5}\n- {f6}\nLength: {f7}.\n\nWrite it in full. No placeholder text and no instruction\nsentences left inside. Ready to send after light editing."},{"id":"c08t2","course":8,"title":"Research with sources you can open","note":"Use this when you want citations. For creative writing, Claude or ChatGPT will usually give you a better result.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Your topic or question","hint":""}],"template":"Research {f0} and give me a sourced\nsummary.\n\nI want to know:\n1. What is the current state of this?\n2. The key facts or numbers I should know.\n3. What has changed recently that most people may not\n   have caught up with.\n4. Any common beliefs about this that the evidence does not\n   support.\n\nSearch the web for current information.\nCite every significant claim so I can click through and check.\nPrefer reputable publications and organisations."},{"id":"c08t3","course":8,"title":"Summarising something long","note":"Paste the text straight into copilot.microsoft.com. Doing this inside Word needs a paid Copilot licence, and pasting works just as well.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Here is a long document I need summarised","hint":"Paste the full text here","long":true}],"template":"Here is a long document I need summarised:\n\n{f0}\n\nGive me:\n1. A one paragraph summary of the main point.\n2. The 5 most important specific points or findings.\n3. Any actions or decisions that are needed.\n4. Anything I should be concerned about or look at twice.\n\nKeep it specific. No vague observations."},{"id":"x08_68","course":8,"title":"Ask something that needs working through","note":"A slower mode for questions where the quick answer is not good enough.","kind":"Think Deeper","setup":["Switch Think Deeper on before you send this."],"fields":[{"id":"question","label":"The question","hint":"The one you have been going round on","options":null,"long":true},{"id":"tried","label":"What you have already considered","hint":""},{"id":"matters","label":"What makes this difficult","hint":""}],"template":"Think this through properly rather than giving me a quick answer.\n\nThe question: {question}\nWhat I have already considered: {tried}\nWhat makes it difficult: {matters}\n\nWork through it step by step and show me the reasoning, not just the\nconclusion. Where there is a genuine trade-off, name it rather than resolving\nit quietly. Tell me what you are least confident about.\n\nThen give me your actual answer, in one paragraph, without hedging."},{"id":"x08_69","course":8,"title":"Ask about what is on your screen","note":"It looks at your screen or a photo and answers from what is there.","kind":"Copilot Vision","setup":["Turn Vision on and have the screen or photo in front of it before you ask."],"fields":[{"id":"showing","label":"What it is looking at","hint":"Such as a form, an error message, a spreadsheet"},{"id":"want","label":"What you need to know","hint":"","options":null,"long":true},{"id":"stuck","label":"What you have already tried","hint":""}],"template":"Look at what is on my screen. {want}\n\nWhat you are looking at: {showing}\nWhat I have already tried: {stuck}\n\nTell me what to do in order, referring to what you can actually see. If you\ncannot see something clearly enough to be sure, say so rather than guessing."},{"id":"x08_70","course":8,"title":"Use it on whatever you have open","note":"Already installed on a Windows machine, with nothing to set up.","kind":"Windows and Edge","setup":[],"fields":[{"id":"page","label":"What you have open","hint":""},{"id":"want","label":"What you want from it","hint":"","options":null,"long":true},{"id":"form","label":"How you want it back","hint":"","options":["A short summary","The answer to one question","The parts that matter to me","A reply I can send"]}],"template":"{want}\n\nWhat I have open: {page}\nHow I want it back: {form}\n\nUse what is actually on the page. Quote the part you used. If it is not there,\nsay so instead of filling the gap."},{"id":"x08_71","course":8,"title":"Work on the document itself","note":"It works in your documents and email rather than in a separate window.","kind":"Inside Word and Outlook","setup":["Open the document or email first, then open Copilot beside it."],"fields":[{"id":"doc","label":"What you are working on","hint":"Such as a report, a long email thread, a proposal"},{"id":"want","label":"What you need done","hint":"","options":null,"long":true},{"id":"keep","label":"What must not change","hint":"Such as the figures, the structure, the tone"}],"template":"Working on this {doc}:\n\n{want}\n\nWhat must not change: {keep}\n\nMake the changes in the document rather than writing a new version underneath.\nThen tell me in one short list what you changed and why, so I can undo\nanything I disagree with."},{"id":"c09t1","course":9,"title":"Working through a problem step by step","note":"Read the reasoning before the conclusion. If it makes an assumption you know is wrong, say so and ask it to think again.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"The problem","hint":"What is happening, what you have tried, and what is not working","long":true},{"id":"f1","label":"The context","hint":"The background, the constraints you are working within, and what a good outcome looks like","long":true}],"template":"I have a problem I need to work through carefully.\n\nThe problem: {f0}.\nThe context: {f1}.\n\nWork through this step by step, showing your reasoning at each\nstage. Then give me:\n1. The root cause, based on your analysis\n2. Three specific solutions, with the trade-offs of each\n3. Your recommended solution and the clearest reason for it\n4. The first thing I should do in the next 24 hours\n\nDo not give me a fast answer. Think it through first."},{"id":"c09t2","course":9,"title":"Analysing a situation properly","note":"Include the parts you are uncertain or uncomfortable about. It gives more useful analysis with the full picture than with the tidy version.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"The situation","hint":"Plan or decision, described as specifically as you can","long":true},{"id":"f1","label":"The full context","hint":"What you are considering, your goals, the resources you have, the constraints, and what already worries you about it","long":true}],"template":"I want a thorough analysis of {f0}.\n\nThe full context: {f1}.\n\nAnalyse this properly:\n1. What is strongest about what I have described?\n2. What risks or weaknesses am I underestimating?\n3. What would someone experienced in this area notice\n   immediately that I have missed?\n4. What is the single most important thing to fix before\n   I go further?\n\nThink carefully. I would rather have a thorough answer than\na fast one."},{"id":"c09t3","course":9,"title":"Getting a recommendation you can check","note":"Point 3 is the important one. If it cannot make a strong case against its own advice, the answer was probably obvious. If it can, reconsider.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"The decision","hint":"The choice between options, or the course of action","long":true},{"id":"f1","label":"My situation","hint":"What you are dealing with, the options you are weighing, what you value, what worries you, and what you have already tried","long":true}],"template":"I need a clear recommendation on {f0}.\n\nMy situation: {f1}.\n\nGive me:\n1. Your clear recommendation. One answer, not a list of options\n   that leaves me where I started.\n2. The three strongest reasons for it.\n3. The strongest argument against it, made properly.\n4. What I should watch for to know whether it is working.\n\nShow your reasoning. I want to understand why, not just what."},{"id":"x09_72","course":9,"title":"Watch it reason, and find where it goes wrong","note":"It writes out the reasoning before the answer, so you can follow it.","kind":"Thinking mode","setup":["Switch thinking mode on before you send this."],"fields":[{"id":"problem","label":"The problem","hint":"Something with more than one step","options":null,"long":true},{"id":"know","label":"What you already know","hint":""},{"id":"check","label":"What you most want to be right about","hint":""}],"template":"Work through this and show me your reasoning as you go.\n\nThe problem: {problem}\nWhat I already know: {know}\nWhat I most need to be right about: {check}\n\nShow each step and what it rests on. Where you make an assumption, say so at\nthe point you make it rather than at the end.\n\nWhen you have finished, tell me which step the whole answer depends on most,\nso I know where to check first."},{"id":"x09_73","course":9,"title":"Use it when the answer depends on something current","note":"Switch it on when what you are asking about might have changed.","kind":"Web search","setup":["Switch web search on first, or it will answer from what it already knew."],"fields":[{"id":"question","label":"What you want to know","hint":"","options":null,"long":true},{"id":"when","label":"How current it needs to be","hint":"","options":["Today","This month","This year","Just not years out of date"]},{"id":"why","label":"What you are deciding","hint":""}],"template":"{question}\n\nHow current this needs to be: {when}\nWhat I am deciding: {why}\n\nSearch rather than answering from memory, and tell me the date of what you\nfound. If the most recent thing you can find is older than {when}, say so\nplainly rather than presenting it as current.\n\nSay which parts are well established and which come from a single source."},{"id":"x09_74","course":9,"title":"Ask about a document instead of reading it","note":"Give it the document and ask the question you actually have.","kind":"File upload","setup":["Attach the document to your message first."],"fields":[{"id":"doc","label":"What the document is","hint":""},{"id":"want","label":"What you need to know","hint":"","options":null,"long":true},{"id":"why","label":"What you will do with it","hint":""}],"template":"I have uploaded {doc}. {want}\n\nWhat I will do with it: {why}\n\nAnswer the question first, before any summary. Quote the parts you used. If\nthe answer is not in the document, say so rather than answering from general\nknowledge, and tell me what would answer it."},{"id":"x09_75","course":9,"title":"Understand what open models mean for you","note":"Its models can be downloaded and run by other companies, which is why you see them elsewhere.","kind":"Open models","setup":[],"fields":[{"id":"care","label":"What you want to understand","hint":"","options":["Where my data goes","Why I see this model in other products","Whether it is safe to use","What it means for the cost of things"]},{"id":"context","label":"What you use it for","hint":"So the answer is about your situation"}],"template":"Explain what it means that a model is open and can be downloaded and run by\nother companies.\n\nWhat I want to understand: {care}\nWhat I use these tools for: {context}\n\nIn plain English, no jargon:\n1. What open actually means here, and what it does not mean.\n2. What that changes for someone in my situation, specifically about {care}.\n3. The practical difference between using it here and using it inside somebody\n   else's product.\n4. What I should actually do differently, if anything.\n\nIf the honest answer is that it makes no practical difference to me, say so."},{"id":"c10t1","course":10,"title":"Meal planning and the shopping list","note":"After the first time, save your household details as a note and paste them in each week, changing only the budget and anything new.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Number","hint":""},{"id":"f1","label":"Your budget","hint":""},{"id":"f2","label":"Anything relevant","hint":"Such as no seafood, vegetarian on Tuesdays, a nut allergy, or a picky eater, or write none","long":true},{"id":"f3","label":"Anything you know you are making","hint":"So it is not repeated, or write none","long":true}],"template":"Plan 5 weeknight dinners for {f0} people.\n\nMy constraints:\n- Budget: {f1} for all five together\n- Time: each should take under {f0} minutes\n- Dietary needs: {f2}\n- Already planned this week: {f3}\n\nFor each dinner give me the name, a rough time to make it,\nand the ingredients I need to buy rather than the ones I\nprobably already have.\n\nThen a full shopping list organised by section: produce,\ndairy, meat, pantry."},{"id":"c10t2","course":10,"title":"Writing the message you are avoiding","note":"Be honest in the situation, including the uncomfortable parts. Pick the version that sounds most like you and change one line before sending.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["An email","A text","A WhatsApp message","A reply"]},{"id":"f1","label":"Who they are and your relationship with them","hint":"","long":true},{"id":"f2","label":"The situation","hint":"What happened or what needs saying, honestly, including your part in it if that matters","long":true},{"id":"f3","label":"What I want to achieve","hint":"Pick the closest","options":["Say no politely","Apologise without over-explaining","Set a limit","Ask for something","Address a problem directly"]},{"id":"f4","label":"What I am worried about","hint":"What you fear will happen if you send it","long":true}],"template":"Help me write {f0} to {f1}.\n\nThe situation: {f2}.\nWhat I want to achieve: {f3}.\nWhat I am worried about: {f4}.\n\nWrite two versions:\nVersion 1, short and direct, under 60 words.\nVersion 2, warmer and fuller, under 120 words.\nNo greeting. Just the body of the message."},{"id":"c10t3","course":10,"title":"Getting a clear picture of your money","note":"Use whatever currency you think in and keep the numbers rough. It does not need to be exact to show you the pattern.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Your income","hint":""},{"id":"f1","label":"Rent or mortgage","hint":"Amount"},{"id":"f2","label":"Car or travel","hint":"Amount"},{"id":"f3","label":"Subscriptions","hint":"Amount"},{"id":"f4","label":"Groceries","hint":"Amount"},{"id":"f5","label":"Eating out","hint":"Amount"},{"id":"f6","label":"My goal","hint":"Pick the closest","options":["Save a set amount by a date","Pay something off","Have more left at month end","Just understand where it goes"]}],"template":"Help me understand my money and make a simple plan.\n\nMy situation:\nMonthly take-home income: roughly {f0}\nFixed costs I cannot change:\n- {f1}\n- {f2}\n- {f3}\nVariable spending, roughly:\n- {f4}\n- {f5}\n\nMy goal: {f6}\n\nTell me:\n1. Where most of my money is actually going.\n2. The most realistic place to find some back, without\n   making my life miserable.\n3. One change to make this month, and what it is worth.\n4. What to check again in three months."},{"id":"x10_4","course":10,"title":"A packing list for this actual trip","note":"Built around where you are going and what you are doing, not a generic list.","kind":"Packing lists","setup":[],"fields":[{"id":"where","label":"Where you are going","hint":"Place and what the weather is likely to be"},{"id":"days","label":"How many nights","hint":""},{"id":"doing","label":"What you will actually be doing","hint":"Such as a wedding one evening, walking in the day, one smart dinner"},{"id":"who","label":"Who is going","hint":"Such as me and two children aged 4 and 7"},{"id":"bag","label":"What you are taking it in","hint":"","options":["Hand luggage only","One suitcase","Car, space is not a problem"]}],"template":"Write me a packing list for this trip.\n\nWhere: {where}\nHow many nights: {days}\nWhat I will be doing: {doing}\nWho is going: {who}\nWhat I am packing into: {bag}\n\nGroup it by category, not by day. For each item say how many.\n\nThen separately give me:\n- The five things people most often forget for a trip like this.\n- Anything I can leave behind because I will be able to buy or borrow it there.\n- What to put in the bag I keep with me rather than in the case.\n\nDo not pad the list. If something is only worth taking in one scenario, say\nwhich."},{"id":"x10_5","course":10,"title":"Explain this letter in plain English","note":"For anything official that is written to protect the sender rather than inform you.","kind":"Explaining a letter","setup":[],"fields":[{"id":"letter","label":"The letter","hint":"Paste the whole thing, including the bits you skipped","options":null,"long":true},{"id":"worry","label":"What you are worried it means","hint":""},{"id":"relation","label":"Who sent it","hint":"Such as the council, a bank, a landlord, the school"}],"template":"Explain this letter to me in plain English.\n\nWho sent it: {relation}\nWhat I am worried it means: {worry}\n\nThe letter:\n{letter}\n\nTell me:\n1. What it actually says, in three sentences, with no jargon.\n2. Whether it needs me to do anything, and by when. If there is a deadline, put\n   it first.\n3. What happens if I do nothing.\n4. Anything in it that is routine wording rather than something aimed at me.\n5. The question I should ask them, if I need to reply.\n\nIf my worry is unfounded, say so plainly. If it is justified, say that plainly\ntoo."},{"id":"x10_6","course":10,"title":"Gift ideas that actually fit the person","note":"Five questions about them, and you get suggestions rather than the usual candle.","kind":"Gift ideas that fit","setup":[],"fields":[{"id":"who","label":"Who it is for","hint":"Their name, or how you know them"},{"id":"occasion","label":"The occasion","hint":"","options":["A birthday","Christmas","A thank you","A new baby","A new home","A leaving present","No reason at all"]},{"id":"like","label":"What they are actually like","hint":"The things you would say about them to someone who had never met them","options":null,"long":true},{"id":"ruled","label":"What is already ruled out","hint":"Such as candles, chocolates, vouchers"},{"id":"weight","label":"The sort of present it is","hint":"","options":["Small and thoughtful","A proper present","Something significant","Something made or written, not bought"]}],"template":"I need help choosing a gift and I want real suggestions, not the obvious ones.\n\nWho it is for: {who}\nThe occasion: {occasion}\nWhat they are like: {like}\nAlready tried or ruled out: {ruled}\nThe sort of present it is: {weight}\n\nGive me 10 ideas. For each one, one line on why it suits this particular\nperson, based on what I have told you.\n\nRules:\n- Nothing I listed as ruled out.\n- Nothing generic that would suit anybody.\n- At least two that are not objects, such as an experience or something I\n  could arrange rather than buy.\n- At least one I almost certainly have not thought of.\n- Put the ones you are most confident about first, and say what makes you\n  confident."},{"id":"x10_7","course":10,"title":"A short speech that sounds like you","note":"For the wedding, the retirement, the birthday. Two minutes is plenty.","kind":"Speeches and toasts","setup":[],"fields":[{"id":"occasion","label":"What the occasion is","hint":""},{"id":"who","label":"Who you are speaking about","hint":"And how you know them"},{"id":"stories","label":"Two or three things that are actually true about them","hint":"Small specific things beat big compliments","options":null,"long":true},{"id":"room","label":"Who is in the room","hint":"So you know what will land and what will not"},{"id":"length","label":"How long","hint":"","options":["About a minute","Two minutes","Three to four minutes"]},{"id":"tone","label":"How it should feel","hint":"","options":["Warm and a bit funny","Mostly funny","Sincere, not sentimental","Short and heartfelt"]}],"template":"Help me write a short speech.\n\nThe occasion: {occasion}\nWho I am speaking about: {who}\nHow I know them and what is true about them: {stories}\nWho is in the room: {room}\nHow long: {length}\nHow it should feel: {tone}\n\nWrite it to be spoken, not read. Short sentences. Nothing I would be\nembarrassed to say out loud.\n\nRules:\n- Open with something specific about them, never with a general statement\n  about the occasion.\n- Use the details I gave you. Do not invent stories or memories.\n- One joke at most, and it must be kind.\n- End on the line everyone will remember, and make it one sentence.\n\nThen tell me which sentence to slow down on, and where people will probably\nlaugh so I can leave a gap."},{"id":"c11t1","course":11,"title":"Knowing what to say before you film","note":"Read it out loud before filming. Anything you stumble over is written rather than spoken, and should be rewritten.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Topic","hint":"The one thing you want to say"},{"id":"f1","label":"Who is watching","hint":"Your audience"},{"id":"f2","label":"What I want them to do after","hint":"Pick the closest","options":["Follow","Comment","Click"]},{"id":"f3","label":"How I talk","hint":"Pick the closest","options":["Warm","Direct","Funny","Plain"]}],"template":"Write a script for a short video, under 60 seconds.\n\nTopic: {f0}.\nWho is watching: {f1}.\nWhat I want them to do after: {f2}.\nHow I talk: {f3}.\n\nRules:\n- Open with a line that stops a scroll, before any introduction\n- One idea only, no list of five things\n- Short sentences I can say out loud without stumbling\n- Tell me roughly how long each part should take\n- End with one clear thing to do\n\nWrite it the way I would speak, not the way I would write."},{"id":"c11t2","course":11,"title":"Turning one recording into a week of posts","note":"Point 1 saves the most time. Knowing exactly where a clip starts and ends means you are trimming rather than watching the whole thing back.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Here is the transcript of a video I recorded","hint":"Paste the transcript","long":true},{"id":"f1","label":"My audience","hint":"Who they are"}],"template":"Here is the transcript of a video I recorded:\n\n{f0}\n\nMy audience: {f1}.\n\nGive me:\n1. The three best 30 second sections to cut as clips, quoting\n   the first and last line of each so I can find them.\n2. A written post built from the strongest idea.\n3. A short email to my list on the
