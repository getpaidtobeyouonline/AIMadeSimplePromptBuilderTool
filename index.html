same thing.\n4. Five lines worth putting on screen as captions.\n\nKeep my words wherever they already work."},{"id":"c11t3","course":11,"title":"Captions and the finishing touches","note":"Always read the automatic captions. They get names and specialist words wrong, and a wrong word on screen is what people comment on.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Copy the automatic captions from the platform or your editor","hint":"Then fix them here","long":true},{"id":"f1","label":"Here are the automatic captions from my video","hint":"Paste the caption text","long":true},{"id":"f2","label":"List them","hint":""}],"template":"{f0}\n\nHere are the automatic captions from my video:\n\n{f1}\n\nPlease:\n1. Fix anything obviously misheard, especially names and\n   any words specific to my subject: {f2}.\n2. Break the lines so each one is short enough to read\n   on a phone.\n3. Write three title options for this video.\n4. Write a short description with the key point first."},{"id":"x11_10","course":11,"title":"Ten openings for the same video","note":"The first line decides whether anyone watches the second. Write it ten times.","kind":"Write the hook ten ways","setup":[],"fields":[{"id":"about","label":"What the video is about","hint":""},{"id":"who","label":"Who you are trying to reach","hint":""},{"id":"promise","label":"What they get by the end","hint":""},{"id":"style","label":"What you are comfortable saying","hint":"","options":["Plain and direct","A question","A story opening","Slightly contrarian","Warm and personal"]}],"template":"Write me ten different opening lines for a short video.\n\nWhat it is about: {about}\nWho I am trying to reach: {who}\nWhat they get by the end: {promise}\nWhat I am comfortable saying: {style}\n\nRules for every one of them:\n- Under twelve words.\n- Something a real person would say out loud.\n- No \"in this video\", no \"let me tell you\", no greeting.\n- Each one has to work with the sound off, as text on screen.\n\nMake them genuinely different from each other, not ten versions of one idea.\n\nThen pick the two you think are strongest and say why, and tell me which one\nis riskiest and who it might put off."},{"id":"x11_11","course":11,"title":"Plan a batch so you film once","note":"Filming once a month beats meaning to film every week.","kind":"Plan a batch","setup":[],"fields":[{"id":"topic","label":"What your videos are about","hint":""},{"id":"many","label":"How many you want to film","hint":"","options":["Four, one a week","Eight, two a week","Twelve, three a week"]},{"id":"time","label":"How long you have to film","hint":"","options":["An hour","An afternoon","A whole day"]},{"id":"audience","label":"Who they are for","hint":""},{"id":"done","label":"What you have already covered","hint":"So it does not repeat you"}],"template":"Help me plan a batch of short videos so I can film them all in one go.\n\nWhat my videos are about: {topic}\nHow many: {many}\nHow long I have to film: {time}\nWho they are for: {audience}\nWhat I have already covered: {done}\n\nGive me:\n1. The list, in the order I should film them, with a title and a one line\n   promise for each.\n2. Which ones share a setting or an outfit, so I film those together.\n3. The one that should go out first, and why.\n4. What I need to have ready before I press record, as a short checklist.\n\nKeep the number realistic for the time I have. If what I asked for will not\nfit, say so and tell me what will."},{"id":"x11_8","course":11,"title":"Turn a rambling voice note into a draft","note":"Say it out loud, paste the transcript, get something usable.","kind":"Voice note to first draft","setup":[],"fields":[{"id":"transcript","label":"The transcript","hint":"Paste it, tidying nothing. The mess is fine.","options":null,"long":true},{"id":"want","label":"What you want out of it","hint":"","options":["A social post","An email","A script for a short video","A page for my website","Notes I can act on"]},{"id":"who","label":"Who will read or watch it","hint":""},{"id":"length","label":"How long it should be","hint":"","options":["Very short, under 100 words","Around 200 words","As long as it needs"]}],"template":"Here is a transcript of me talking out loud. Turn it into {want}.\n\nWho it is for: {who}\nHow long: {length}\n\nThe transcript:\n{transcript}\n\nRules:\n- Keep my words and my phrasing wherever they work. Do not make it sound\n  polished and generic.\n- Cut the repetition, the false starts and the bits where I went round in a\n  circle.\n- If I made the same point twice in different words, keep the better one.\n- Start with the strongest thing I said, even if I said it near the end.\n\nAfterwards, tell me the one thing I said that I should have made more of."},{"id":"x11_9","course":11,"title":"Get a week of posts out of one old video","note":"The video already exists. This is about everything else you can make from it.","kind":"Repurpose an old video","setup":[],"fields":[{"id":"about","label":"What the video was about","hint":""},{"id":"transcript","label":"The transcript or your notes","hint":"Paste whatever you have","options":null,"long":true},{"id":"where","label":"Where you post","hint":"Such as Instagram, a newsletter, LinkedIn, TikTok"},{"id":"audience","label":"Who follows you","hint":""}],"template":"I have an old video and I want to get more out of it without filming again.\n\nWhat it was about: {about}\nWhere I post: {where}\nWho follows me: {audience}\n\nThe transcript or my notes:\n{transcript}\n\nGive me:\n1. Three moments worth cutting as short clips. For each, quote the line it\n   should start on and say why that moment holds attention.\n2. One written post, ready to publish.\n3. One short email to my list, with a subject line.\n4. Five lines that would work as on-screen text or captions.\n5. One question I could ask my audience that comes out of this.\n\nUse what is actually in the transcript. Do not invent things I did not say."},{"id":"c12t1","course":12,"title":"Starting where you actually are","note":"Being honest about your level is the whole trick. Overstating it gets you an explanation you cannot follow.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"The subject","hint":""},{"id":"f1","label":"What I already know","hint":"Be honest about your level"},{"id":"f2","label":"Where it stops making sense","hint":"The specific point you lose it"},{"id":"f3","label":"Why I want this","hint":"What you will do with it"}],"template":"I want to understand {f0}.\n\nWhat I already know: {f1}.\nWhere it stops making sense: {f2}.\nWhy I want this: {f3}.\n\nPlease:\n1. Start from where my understanding stops, not from the\n   basics.\n2. Explain it in plain language with one concrete example.\n3. Tell me what people commonly get wrong about this.\n4. Then ask me three questions to check I followed it.\n\nDo not flatter me and do not skip ahead."},{"id":"c12t2","course":12,"title":"A study plan you will actually follow","note":"Point 4 is the useful one. Most plans fail from including everything rather than from leaving things out.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"The subject","hint":""},{"id":"f1","label":"Time I genuinely have","hint":"Minutes per day, and which days","long":true},{"id":"f2","label":"My deadline, if any","hint":"A date, or write none","long":true},{"id":"f3","label":"How I learn best","hint":"Pick the closest","options":["Reading","Watching","Doing","Being tested"]},{"id":"f4","label":"What I already know","hint":"Your starting point"}],"template":"Build me a realistic plan to learn {f0}.\n\nTime I genuinely have: {f1}.\nMy deadline, if any: {f2}.\nHow I learn best: {f3}.\nWhat I already know: {f4}.\n\nGive me:\n1. A week by week plan that fits the time I actually have.\n2. What to do in each session, specifically.\n3. How I will know I have understood each part.\n4. What to skip, because it is not worth my time yet.\n\nBe realistic. A plan I abandon is worse than a short one."},{"id":"c12t3","course":12,"title":"Testing yourself properly","note":"The instruction to ask one at a time is what makes this work. A list of ten questions turns back into reading.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"The subject or the material below","hint":"","long":true},{"id":"f1","label":"Paste your notes, or name the topic","hint":"","long":true}],"template":"Test me on {f0}.\n\n{f1}\n\nPlease:\n1. Ask me one question at a time and wait for my answer.\n2. Start easy and get harder.\n3. When I get something wrong, do not just correct me.\n   Ask a simpler question that leads me to it.\n4. After ten questions, tell me what I clearly know, what\n   is shaky, and what to study again.\n\nDo not give me the answers up front."},{"id":"x12_12","course":12,"title":"Turn your notes into a test","note":"Reading notes again is not revision. Being asked is.","kind":"Turn notes into questions","setup":[],"fields":[{"id":"notes","label":"Your notes","hint":"Paste them, however messy","options":null,"long":true},{"id":"exam","label":"What you are preparing for","hint":""},{"id":"count","label":"How many questions","hint":"","options":["Ten","Twenty","Thirty"]}],"template":"Turn my notes into {count} questions that test whether I actually understand\nthis, not whether I can recognise the words.\n\nWhat I am preparing for: {exam}\n\nMy notes:\n{notes}\n\nMix them up: some recall, some explain why, some apply it to a situation that\nis not in my notes.\n\nGive me all the questions first, with no answers. Then the answers underneath,\neach with one line on what I needed to understand to get it.\n\nIf something important is missing from my notes, say so at the end."},{"id":"x12_13","course":12,"title":"Explain it with something I already know","note":"For the one idea that keeps sliding off.","kind":"Ask for an analogy","setup":[],"fields":[{"id":"concept","label":"What you cannot get your head round","hint":""},{"id":"stuck","label":"What you do understand about it so far","hint":"And where it stops making sense","options":null,"long":true},{"id":"world","label":"Something you know well","hint":"Such as cooking, football, gardening, music, driving"}],"template":"Explain {concept} using an analogy from {world}, which I know well.\n\nWhat I already understand, and where it stops making sense: {stuck}\n\nThen:\n1. Give me the analogy and walk it through properly.\n2. Tell me where the analogy breaks down, because they always do, and what is\n   different in the real thing.\n3. Give me a second, completely different analogy, so I am not relying on one\n   picture.\n4. Ask me one question that would show whether I have actually got it."},{"id":"x12_14","course":12,"title":"Find the gaps before the exam does","note":"The dangerous gaps are the ones you do not know are there.","kind":"Find what you do not know","setup":[],"fields":[{"id":"subject","label":"The subject or topic","hint":""},{"id":"covered","label":"What you have studied so far","hint":"List it roughly","options":null,"long":true},{"id":"when","label":"When the exam or deadline is","hint":""}],"template":"I am studying {subject} and my exam or deadline is {when}.\n\nHere is what I have covered: {covered}\n\nWork out what I am missing.\n\n1. List what a person is normally expected to know for this, and mark each one\n   as covered, half covered, or missing based on what I told you.\n2. For the gaps, say which actually matter and which are detail.\n3. Give me the three to fix first, in order, and roughly how long each takes.\n4. Name anything I think I understand that people commonly get wrong, so I can\n   check myself.\n\nBe honest rather than encouraging."},{"id":"x12_15","course":12,"title":"Practise a language by using it","note":"A conversation you can have badly, as many times as you like.","kind":"Practise a language","setup":[],"fields":[{"id":"lang","label":"Which language","hint":""},{"id":"level","label":"Where you are","hint":"","options":["Complete beginner","I know some words","I can get by","I am fairly fluent but rusty"]},{"id":"scene","label":"The situation you want to practise","hint":"Such as ordering food, a job interview, meeting the neighbours"},{"id":"correct","label":"How you want correcting","hint":"","options":["Correct me every time","Correct me at the end","Only when I would be misunderstood"]}],"template":"Let us practise {lang}. I am {level}.\n\nThe situation: {scene}\nHow I want correcting: {correct}\n\nRules:\n- You play the other person. Stay in character.\n- Start simple and get harder as I cope.\n- When you correct me, show what I said and what it should be, and one line on\n  why. Do not lecture.\n- If I get stuck, give me the phrase I need rather than letting me flounder.\n- Every few turns, throw in something slightly unexpected, because real\n  conversations do that.\n\nStart now with your first line, and nothing else."},{"id":"c13t1","course":13,"title":"Explaining something to a child","note":"The last line matters. Ask for an explanation you can deliver, not an answer to copy, or nobody learns anything.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"The topic","hint":""},{"id":"f1","label":"Age","hint":""},{"id":"f2","label":"What they already know","hint":"Roughly where they are"},{"id":"f3","label":"Where they are getting stuck","hint":"The specific bit, if you know","long":true}],"template":"Explain {f0} to a {f1} year old.\n\nWhat they already know: {f2}.\nWhere they are getting stuck: {f3}.\n\nPlease:\n1. Explain it in plain words with one everyday example.\n2. Do not use technical terms without explaining them first.\n3. Give me two questions I can ask to check they followed it.\n4. Suggest one way to make it stick, such as a game or a\n   thing to draw.\n\nDo not do the homework for them. Help me help them."},{"id":"c13t2","course":13,"title":"Planning a day out or a trip","note":"Say what to avoid as well as what you want. A plan that ignores the things your family hates will not survive the morning.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Day out","Weekend","Trip"]},{"id":"f1","label":"Who is going","hint":"Such as ages","long":true},{"id":"f2","label":"Where","hint":"The area or town"},{"id":"f3","label":"Budget","hint":"Roughly what you want to spend"},{"id":"f4","label":"How long","hint":"The time you have"},{"id":"f5","label":"What matters","hint":"What everyone actually enjoys, and anything to avoid, such as long walks or loud places","long":true},{"id":"f6","label":"Getting there","hint":"Pick the closest","options":["Car","Public transport","Walking"]}],"template":"Plan a {f0} for {f1}.\n\nWhere: {f2}.\nBudget: {f3}.\nHow long: {f4}.\nWhat matters: {f5}.\nGetting there: {f6}.\n\nGive me a realistic plan with rough timings, one backup for\nbad weather, and what to take. Do not pack it too full."},{"id":"c13t3","course":13,"title":"Writing the letter you are avoiding","note":"That last instruction does the work. Most people either soften the request until it disappears or write something too angry to send.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["A complaint","An email to a school","A request","A follow-up"]},{"id":"f1","label":"Who it goes to","hint":""},{"id":"f2","label":"What happened","hint":"The facts, in order, with dates if you have them","long":true},{"id":"f3","label":"What I want","hint":"The specific outcome you are asking for","long":true},{"id":"f4","label":"What I have already done","hint":"Any previous contact"},{"id":"f5","label":"Tone","hint":"Pick the closest","options":["Firm but polite","Warm","Formal"]},{"id":"f6","label":"Your limit","hint":""}],"template":"Help me write {f0} to {f1}.\n\nWhat happened: {f2}.\nWhat I want: {f3}.\nWhat I have already done: {f4}.\nTone: {f5}.\n\nWrite it in full, under {f6} words. State the facts,\nmake the request clearly, and give a date for a reply.\nNo anger and no apologising for asking."},{"id":"x13_16","course":13,"title":"Understand what the school report says","note":"The polite wording often hides the actual message.","kind":"Reading a school report","setup":[],"fields":[{"id":"report","label":"The report","hint":"Paste it, or the part you are unsure about","options":null,"long":true},{"id":"age","label":"How old they are","hint":""},{"id":"worry","label":"What you are worried about","hint":""}],"template":"Help me understand my child's school report. They are {age}.\n\nWhat I am worried about: {worry}\n\nThe report:\n{report}\n\nTell me:\n1. What it is actually saying, in plain words, including anything said gently\n   that means something more serious.\n2. What is genuinely going well. Do not skip this.\n3. What, if anything, needs attention, and whether it is urgent or just worth\n   watching.\n4. Three questions worth asking at parents evening, based on this report.\n5. One thing I could do at home that would actually help.\n\nIf it is a good report and I am worrying over nothing, say so."},{"id":"x13_17","course":13,"title":"Plan the party without the spiral","note":"Everything in one list, in the order it needs doing.","kind":"Planning a party","setup":[],"fields":[{"id":"who","label":"Whose party and how old","hint":""},{"id":"guests","label":"How many coming","hint":"Children and adults"},{"id":"where","label":"Where it is","hint":"Such as at home, the park, a hall"},{"id":"budget","label":"What matters most to you","hint":"","options":["Keeping it simple","Making it special","Keeping the mess down","Everyone being fed properly"]},{"id":"when","label":"How long you have to plan","hint":""}],"template":"Help me plan a party.\n\nWhose and how old: {who}\nHow many coming: {guests}\nWhere: {where}\nWhat matters most: {budget}\nHow long I have: {when}\n\nGive me:\n1. A plan working backwards from the day, with what to do each week and then\n   each day.\n2. A shopping list grouped by where I would buy it.\n3. A running order for the day itself, with rough timings, including when to\n   do food and when to do the cake.\n4. Two things that usually go wrong at a party like this, and how to avoid\n   them.\n5. The things I can drop if I run out of time, in the order I should drop them.\n\nKeep it realistic for one person organising this alongside everything else."},{"id":"x13_18","course":13,"title":"See it from their side before you reply","note":"For the disagreement you keep replaying in your head.","kind":"Seeing both sides","setup":[],"fields":[{"id":"situation","label":"What is going on","hint":"Describe it as you see it","options":null,"long":true},{"id":"them","label":"Who the other person is","hint":"And what matters to them"},{"id":"want","label":"What you actually want to happen","hint":""},{"id":"said","label":"What has been said so far","hint":"Optional, but it helps"}],"template":"Help me see this from the other side before I say anything else.\n\nThe situation as I see it: {situation}\nWho they are and what matters to them: {them}\nWhat has been said so far: {said}\nWhat I actually want to happen: {want}\n\nDo this:\n1. Set out how they would describe this, in their words, fairly. Not a\n   caricature.\n2. Name what they are probably worried about that they have not said.\n3. Tell me the part of my own position that is weakest.\n4. Tell me the one thing I could say that moves this forward, and the one\n   thing that would make it worse.\n\nDo not take my side automatically. If I am being unreasonable, say so kindly\nand plainly."},{"id":"x13_19","course":13,"title":"Write the letter you keep putting off","note":"Firm, polite, and on the record. For a landlord, a school, a company.","kind":"Writing to a landlord","setup":[],"fields":[{"id":"to","label":"Who you are writing to","hint":""},{"id":"issue","label":"What the problem is","hint":"When it started, what you have already done","options":null,"long":true},{"id":"want","label":"What you want them to do","hint":"Be specific, including by when"},{"id":"history","label":"What has happened so far","hint":"Any calls, messages or promises"},{"id":"tone","label":"How firm","hint":"","options":["Polite first approach","Firm, this has gone on long enough","Final request before I take it further"]}],"template":"Write a letter for me.\n\nWho it is to: {to}\nThe problem: {issue}\nWhat has happened so far: {history}\nWhat I want them to do: {want}\nHow firm: {tone}\n\nRules:\n- Under 300 words.\n- Lead with what I want, then the facts that support it. Not the other way\n  round.\n- Dates and facts, no emotion, no apologising for raising it.\n- One clear request with a date on it.\n- Polite enough that I would be comfortable if it were read out, firm enough\n  that it is obviously on the record.\n\nAfterwards, tell me what to keep a copy of, and what I can reasonably do next\nif they do not reply."},{"id":"c14t1","course":14,"title":"Deciding what never to paste","note":"Point 3 is the useful part. Almost every sensitive request can be reworded to describe the situation without the identifying details.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"What I use AI for","hint":"Your tasks"},{"id":"f1","label":"What I handle that might be sensitive","hint":"Client details, health information, money, other people's private messages, work documents, or whatever applies","long":true}],"template":"Help me decide what I should never put into an AI tool.\n\nWhat I use AI for: {f0}.\nWhat I handle that might be sensitive: {f1}.\n\nGive me:\n1. A clear list of what I should never paste in, and why.\n2. What is fine to share, so I am not over-cautious.\n3. How to get the same help without sharing the sensitive\n   part, with an example of rewording a request.\n4. What to check in a tool's settings to limit what is kept.\n\nKeep it practical. I want a rule I can actually remember."},{"id":"c14t2","course":14,"title":"Checking whether something is real","note":"Point 3 is worth reading even when the thing turns out to be real. Knowing the shape of the scam is what protects you next time.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"What it is","hint":"Pick the closest","options":["A photo","A video","A message","An email","A voice note"]},{"id":"f1","label":"What it claims","hint":"What it says or shows"},{"id":"f2","label":"How it reached me","hint":"Who sent it and how"},{"id":"f3","label":"What feels off","hint":"Anything that made you suspicious","long":true}],"template":"I want to work out whether something I have been sent is\ngenuine or generated.\n\nWhat it is: {f0}.\nWhat it claims: {f1}.\nHow it reached me: {f2}.\nWhat feels off: {f3}.\n\nTell me:\n1. What specific signs to look for in this type of thing.\n2. What I can check independently, and how.\n3. What a scam using this format usually asks for next.\n4. What to do if I cannot tell either way.\n\nAssume I am not technical."},{"id":"c14t3","course":14,"title":"Checking what AI told you","note":"Do this for anything with a number, a date or a name in it. Two minutes of checking is cheaper than a public correction.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Run this in Perplexity","hint":"Which cites its sources","long":true},{"id":"f1","label":"The first claim","hint":""},{"id":"f2","label":"The second","hint":""},{"id":"f3","label":"The third","hint":""}],"template":"{f0}\n\nI am about to repeat these claims publicly. Check each one\nand cite your sources.\n\nClaims:\n1. {f1}\n2. {f2}\n3. {f3}\n\nFor each, tell me:\n- Accurate, out of date, wrong, or cannot be verified\n- The correct current information if it needs fixing\n- A source I can open and read myself\n\nWhere the evidence is thin, say so rather than filling\nthe gap."},{"id":"x14_20","course":14,"title":"Work out whether a link is safe","note":"Before you click it, not after.","kind":"Check a link first","setup":[],"fields":[{"id":"link","label":"The link, as text","hint":"Type it out rather than clicking it"},{"id":"came","label":"How it reached you","hint":"","options":["A text message","An email","WhatsApp","Social media","Someone I know sent it"]},{"id":"says","label":"What the message said","hint":"Paste it if you still have it","options":null,"long":true}],"template":"I have been sent a link and I want to think before I click it.\n\nThe link, written out: {link}\nHow it reached me: {came}\nWhat the message said: {says}\n\nWalk me through it:\n1. What the address itself tells us. Look at the real domain, anything odd in\n   the spelling, and anything designed to look like a company I know.\n2. What in the message is a pressure tactic, such as urgency, a threat, a\n   refund, or a delivery I am not expecting.\n3. What a genuine message from that organisation would look like instead.\n4. What to do now, in order.\n\nYou cannot visit the link and I am not asking you to. Base this only on what I\nhave shown you, and say clearly which parts you cannot judge from text alone."},{"id":"x14_21","course":14,"title":"Is this a scam, and how do I tell","note":"Paste it and find out what the tell is, so you spot the next one yourself.","kind":"Spot a scam message","setup":[],"fields":[{"id":"message","label":"The message","hint":"Paste all of it","options":null,"long":true},{"id":"claims","label":"Who it claims to be from","hint":""},{"id":"expecting","label":"Were you expecting anything like this","hint":"","options":["No, it came out of the blue","Yes, I am expecting something similar","I am not sure"]}],"template":"Is this a scam? Here is the message.\n\nWho it claims to be from: {claims}\nWas I expecting it: {expecting}\n\nThe message:\n{message}\n\nTell me:\n1. Your honest view: scam, probably a scam, probably genuine, or cannot tell.\n2. The specific things in it that led you there. Quote them.\n3. What a real message from them would have done differently.\n4. The safest way to check, without using anything in the message itself.\n5. What to do if I have already replied or clicked.\n\nTeach me the tell, so I spot the next one without asking."},{"id":"x14_22","course":14,"title":"Agree the rules about phones and AI","note":"Written down once, so it is not renegotiated every evening.","kind":"Write a family rule","setup":[],"fields":[{"id":"ages","label":"Who is in the family","hint":"Ages of the children"},{"id":"about","label":"What the rules are about","hint":"","options":["Phones and screen time","Using AI for homework","Social media","Games","All of it"]},{"id":"worry","label":"What worries you most","hint":""},{"id":"tried","label":"What you have tried already","hint":"And how it went"}],"template":"Help us write some family rules we will actually keep to.\n\nWho is in the family: {ages}\nWhat this covers: {about}\nWhat worries me most: {worry}\nWhat we have tried before: {tried}\n\nWrite:\n1. Five or six rules, in plain words a child of that age would understand,\n   phrased as what we do rather than what is banned.\n2. For each, one line on why, that a child would accept as fair.\n3. The rules that apply to the adults too, because the ones that only apply to\n   children do not last.\n4. What happens when a rule is broken, agreed in advance.\n5. Two sentences to open the conversation, so this does not start as a telling\n   off.\n\nKeep it short enough to go on the fridge."},{"id":"x14_23","course":14,"title":"What is this policy actually agreeing to","note":"The questions that matter, answered from the document itself.","kind":"Understand a privacy policy","setup":[],"fields":[{"id":"policy","label":"The policy or terms","hint":"Paste it, or the part you can find","options":null,"long":true},{"id":"service","label":"What the service is","hint":""},{"id":"care","label":"What you most want to know","hint":"","options":["Who else sees my data","Whether they train AI on what I put in","How I delete everything","Whether they sell it","All of it"]}],"template":"Read this and tell me what I would actually be agreeing to.\n\nThe service: {service}\nWhat I most want to know: {care}\n\nThe policy:\n{policy}\n\nAnswer these, quoting the wording each time:\n1. What they collect, including anything I would not expect.\n2. Who else gets it, and whether that includes selling or sharing for\n   advertising.\n3. Whether what I type is used to train anything, and whether I can turn that\n   off.\n4. How long they keep it, and how I delete it properly.\n5. Anything written vaguely enough to cover far more than it appears to.\n\nFinish with the single sentence in this document I should be most aware of. If\nit is an ordinary policy with nothing unusual, say so."},{"id":"c15t1","course":15,"title":"Clearing the admin half of your job","note":"Point 4 is what makes this safe to send. It tells you what you missed rather than quietly filling it in with something plausible.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Here are my rough notes from a meeting","hint":"Paste your notes, however messy","long":true}],"template":"Here are my rough notes from a meeting:\n\n{f0}\n\nTurn these into:\n1. A short summary anyone who missed it could read.\n2. The decisions that were made, listed plainly.\n3. The actions, with who owns each one and by when, based\n   only on what my notes actually say.\n4. Anything my notes leave unclear that I should check\n   before sending this round.\n\nDo not invent actions or owners that are not in my notes.\nFlag the gaps instead."},{"id":"c15t2","course":15,"title":"Making your case in writing","note":"Framing it around what they care about rather than what you want is the whole difference between a yes and a maybe.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["A proposal","A request","An email"]},{"id":"f1","label":"Who it goes to and their role","hint":""},{"id":"f2","label":"What I want them to agree to","hint":"The specific thing"},{"id":"f3","label":"Why it is worth doing","hint":"Your reasons"},{"id":"f4","label":"What it costs, in time or money or risk","hint":"Be honest"},{"id":"f5","label":"What they care about most","hint":"Their priorities, not yours","long":true},{"id":"f6","label":"What they will push back on","hint":"The objection you expect"},{"id":"f7","label":"Your limit","hint":""}],"template":"Help me write {f0} to\n{f1}.\n\nWhat I want them to agree to: {f2}.\nWhy it is worth doing: {f3}.\nWhat it costs, in time or money or risk: {f4}.\nWhat they care about most: {f5}.\nWhat they will push back on: {f6}.\n\nWrite it so that:\n- The request is clear in the first three lines\n- It is framed around what they care about\n- The objection is answered before they raise it\n- It stays under {f7} words\n\nNo padding and no corporate language."},{"id":"c15t3","course":15,"title":"Knowing what not to put in","note":"If your employer has no policy, point 5 gives you the questions to ask. Asking first is a much better position than explaining afterwards.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"My job","hint":"What you do"},{"id":"f1","label":"What I handle","hint":"The kinds of information you work with, such as customer details, financial data, internal documents, colleagues' personal information","long":true},{"id":"f2","label":"What my employer has said about AI","hint":"Their policy, or write that you do not know","long":true}],"template":"Help me work out what I can and cannot put into an AI tool\nat work.\n\nMy job: {f0}.\nWhat I handle: {f1}.\nWhat my employer has said about AI: {f2}.\n\nTell me:\n1. What is almost certainly fine to use AI for in my role.\n2. What I should never paste in, and why.\n3. The grey areas, and how to decide in the moment.\n4. How to reword a request so I get the help without sharing\n   the sensitive part. Give me one worked example.\n5. What to ask my employer if there is no policy."},{"id":"x15_24","course":15,"title":"Turn a messy call into notes and actions","note":"Written up in two minutes while you still remember it.","kind":"Turn a call into notes","setup":[],"fields":[{"id":"notes","label":"What you scribbled or remember","hint":"However rough","options":null,"long":true},{"id":"call","label":"What the call was about","hint":""},{"id":"who","label":"Who was on it","hint":""},{"id":"need","label":"What you need from the notes","hint":"","options":["Actions and who owns them","A summary to send round","A record for myself","Something to act on today"]}],"template":"Turn my rough notes from a call into something useful.\n\nWhat the call was about: {call}\nWho was on it: {who}\nWhat I need: {need}\n\nMy notes:\n{notes}\n\nGive me:\n1. The decisions actually made, separated from things merely discussed.\n2. The actions, each with who owns it and by when. Mark anything where the\n   owner or date was not agreed.\n3. What was raised and left unresolved.\n4. A three sentence summary I could send round.\n\nOnly use what is in my notes. Where something is unclear, say so rather than\nfilling the gap."},{"id":"x15_25","course":15,"title":"Rehearse the conversation you are dreading","note":"Have it badly here, so you have it well there.","kind":"Rehearse a hard conversation","setup":[],"fields":[{"id":"about","label":"What the conversation is about","hint":""},{"id":"them","label":"Who they are","hint":"And how they tend to react"},{"id":"want","label":"What you want to come out of it","hint":""},{"id":"fear","label":"What you are afraid will happen","hint":""},{"id":"role","label":"How you want to practise","hint":"","options":["You play them, I practise","Give me a script first","Tell me what to expect, then play them"]}],"template":"I have a conversation coming up that I am dreading. Help me prepare.\n\nWhat it is about: {about}\nWho they are and how they tend to react: {them}\nWhat I want out of it: {want}\nWhat I am afraid will happen: {fear}\nHow I want to practise: {role}\n\nFirst, before we start:\n- The one sentence I should open with.\n- The three things they are most likely to say, and a short answer to each.\n- The thing I must not say, however tempting.\n\nThen play them. Stay in character and make it realistic rather than easy. Push\nback the way they actually would. When I handle something badly, finish the\nscene and then tell me plainly what to do instead."},{"id":"x15_26","course":15,"title":"Make the checklist so you stop re-remembering","note":"For the thing you do often and still get wrong.","kind":"Make a checklist","setup":[],"fields":[{"id":"task","label":"The thing you do repeatedly","hint":""},{"id":"wrong","label":"What goes wrong when it does","hint":"The step that gets missed"},{"id":"who","label":"Who will use it","hint":"","options":["Just me","Me and one other person","Anyone on the team","Someone new who has never done it"]},{"id":"when","label":"When it gets used","hint":"Such as every Monday, before every client call"}],"template":"Make me a checklist for something I do repeatedly.\n\nThe task: {task}\nWhat goes wrong when it goes wrong: {wrong}\nWho will use it: {who}\nWhen it gets used: {when}\n\nRules:\n- Each line is one action, starting with a verb, that can be ticked or not.\n  Nothing vague.\n- In the order it actually happens.\n- Put the step that gets missed where it cannot be skipped, and mark it.\n- Short enough to be used rather than admired.\n- Add the two or three checks at the end that catch the common mistakes.\n\nThen tell me which steps could be dropped if I were in a hurry, and which\nabsolutely could not."},{"id":"x15_27","course":15,"title":"Explain your work to someone senior","note":"Same work, told so it is understood in thirty seconds.","kind":"Explain your work upwards","setup":[],"fields":[{"id":"work","label":"What you have been doing","hint":"In your own words, in detail","options":null,"long":true},{"id":"who","label":"Who you are explaining it to","hint":"And what they care about"},{"id":"why","label":"Why you are telling them","hint":"","options":["An update","Asking for a decision","Asking for resources","Showing it was worth doing"]},{"id":"time","label":"How long you have","hint":"","options":["Thirty seconds in a corridor","Two minutes in a meeting","A short written update"]}],"template":"Help me explain my work to someone senior.\n\nWhat I have been doing: {work}\nWho I am telling and what they care about: {who}\nWhy I am telling them: {why}\nHow long I have: {time}\n\nRules:\n- Start with the outcome or the ask, never with the process.\n- Say it in terms of what they care about, not what was difficult for me.\n- Cut the detail that only matters to someone doing the work.\n- One number, if there is an honest one.\n- End with exactly what I need from them, if anything.\n\nThen give me the one follow-up question they are most likely to ask, and a\nshort answer to it."},{"id":"c16t1","course":16,"title":"Tailoring your resume (CV) to one advert (job posting)","note":"The instruction not to invent anything matters. A resume (CV) with something on it you cannot back up in an interview is worse than a weaker honest one.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Here is my resume (CV)","hint":"Paste it","long":true},{"id":"f1","label":"Here is the advert (job posting)","hint":"Paste it","long":true}],"template":"Here is my resume (CV): {f0}\n\nHere is the advert (job posting): {f1}\n\nDo not invent anything. Use only what is in my resume.\n\nTell me:\n1. What this advert is really asking for, including what it\n   implies rather than states.\n2. Which of my existing experience matches, and which I have\n   buried too far down.\n3. A rewritten summary at the top, tailored to this role.\n4. Which bullet points to reorder, reword or cut, and why.\n5. What genuine gap I have against this role, and how to\n   address it honestly in a cover letter.\n\nBe honest about the gap. I would rather know before applying."},{"id":"c16t2","course":16,"title":"A cover letter that sounds like you","note":"Give it your real reason for wanting the job. The honest version is nearly always more persuasive than the polished one.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"The advert (job posting)","hint":"Paste it or summarise it","long":true},{"id":"f1","label":"My relevant experience","hint":"Three or four things, honestly","long":true},{"id":"f2","label":"Why I actually want this job","hint":"The real reason, even if it is practical rather than inspiring","long":true},{"id":"f3","label":"What I am slightly worried about","hint":"Any gap or concern"},{"id":"f4","label":"How I write","hint":"Pick the closest","options":["Warm","Direct","Formal"]}],"template":"Write a cover letter for this role.\n\nThe advert (job posting): {f0}\nMy relevant experience: {f1}\nWhy I actually want this job: {f2}\nWhat I am slightly worried about: {f3}\nHow I write: {f4}\n\nRules:\n- Under 300 words\n- Do not open with \"I am writing to apply for\"\n- Do not repeat my resume (CV) back at them\n- Address the gap once, briefly, without apologising\n- End with a clear, specific next step\n\nSound like a person who wants this job, not a template."},{"id":"c16t3","course":16,"title":"Practising the interview","note":"Answer out loud rather than typing where you can. The gap between what you can write and what you can say under pressure is the thing to close.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"The advert (job posting)","hint":"Paste it or summarise it","long":true},{"id":"f1","label":"My background","hint":"A short summary"},{"id":"f2","label":"What I am worried they will ask","hint":"Your dreaded question"}],"template":"Interview me for this role.\n\nThe advert (job posting): {f0}\nMy background: {f1}\nWhat I am worried they will ask: {f2}\n\nPlease:\n1. Ask me one question at a time and wait for my answer.\n2. Start with the standard ones, then get harder.\n3. Include the question I said I am worried about.\n4. After each answer, tell me briefly what was strong and\n   what was vague.\n5. After eight questions, tell me the two answers to work on.\n\nBe a realistic interviewer, not an encouraging one."},{"id":"x16_28","course":16,"title":"The follow-up note after an interview","note":"Short, specific, and sent the same day.","kind":"The follow-up note","setup":[],"fields":[{"id":"role","label":"The role and the company","hint":""},{"id":"who","label":"Who interviewed you","hint":"Names if you have them"},{"id":"moment","label":"One thing that actually came up","hint":"Something specific you discussed","options":null,"long":true},{"id":"unsaid","label":"Anything you wish you had said","hint":"Optional, this is your chance"},{"id":"feel","label":"How it went","hint":"","options":["Well","Hard to read","Not brilliantly"]}],"template":"Write a short follow-up note after an interview.\n\nThe role: {role}\nWho interviewed me: {who}\nSomething specific we discussed: {moment}\nWhat I wish I had said: {unsaid}\nHow it went: {feel}\n\nRules:\n- Under 150 words.\n- Reference the specific thing we discussed, so it could not have been sent to\n  anyone else.\n- If there is something I wish I had said, put it in once, briefly, without\n  apologising for not saying it.\n- Thank them without grovelling.\n- No \"I am excited about this opportunity\".\n\nEnd with one line that makes it easy for them to reply, without asking them\nfor a decision."},{"id":"x16_29","course":16,"title":"Questions that show you read the posting","note":"For the moment at the end when they ask whether you have any questions.","kind":"Questions to ask them","setup":[],"fields":[{"id":"role","label":"The role and the company","hint":""},{"id":"advert","label":"The job posting","hint":"Paste it or summarise it","options":null,"long":true},{"id":"know","label":"What you already know about them","hint":""},{"id":"care","label":"What you most want to find out","hint":"Such as the team, the workload, whether it is a real vacancy"}],"template":"Give me questions to ask at the end of an interview.\n\nThe role: {role}\nWhat I already know about them: {know}\nWhat I most want to find out: {care}\n\nThe job posting:\n{advert}\n\nGive me:\n1. Five questions that come directly out of the posting, so it is obvious I\n   read it properly.\n2. Two that would tell me what the job is actually like day to day.\n3. One that politely gets at {care}.\n4. The three questions I should not ask at this stage, and why.\n\nFor each question, one line on what a good answer and a worrying answer would\nsound like."},{"id":"x16_30","course":16,"title":"Rewrite your profile so it says something","note":"The paragraph people skim before they decide whether to read on.","kind":"Rewrite your profile","setup":[],"fields":[{"id":"current","label":"What it says now","hint":"Paste it. If you have not written one, say so.","options":null,"long":true},{"id":"do","label":"What you actually do","hint":"And what you are good at"},{"id":"want","label":"What you want to be approached about","hint":""},{"id":"where","label":"Where it goes","hint":"","options":["LinkedIn","The top of my resume","A personal website","A directory listing"]},{"id":"tone","label":"How it should read","hint":"","options":["Plain and factual","Warm and human","Confident","Understated"]}],"template":"Rewrite my profile.\n\nWhere it goes: {where}\nWhat I actually do and am good at: {do}\nWhat I want to be approached about: {want}\nHow it should read: {tone}\n\nWhat it says now:\n{current}\n\nRules:\n- First sentence says what I do for whom. No \"passionate\", no \"results\n  driven\", no \"proven track record\".\n- Specific over impressive. One concrete thing beats three adjectives.\n- Written in my voice, not in corporate voice.\n- Under 120 words.\n\nGive me three versions: one plain, one warmer, one shorter. Then say which you\nwould use for {where} and why."},{"id":"x16_31","course":16,"title":"Make sense of a rejection","note":"For when you want to learn something from it rather than just feel it.","kind":"Talk through a rejection","setup":[],"fields":[{"id":"what","label":"What happened","hint":"The role, how far you got, what they said","options":null,"long":true},{"id":"feel","label":"How you are feeling about it","hint":""},{"id":"pattern","label":"Whether this has happened before","hint":"","options":["First time","It has happened once or twice","It keeps happening"]},{"id":"want","label":"What you want from this","hint":"","options":["Help making sense of it","What to do differently","Whether to ask for feedback","Just to stop going over it"]}],"template":"I did not get a job and I want to think about it properly rather than go\nround in circles.\n\nWhat happened: {what}\nHow I am feeling: {feel}\nHas this happened before: {pattern}\nWhat I want from this: {want}\n\nPlease:\n1. Say what can honestly be concluded from what I have told you, and what\n   cannot. Most rejections tell you very little, and if that is the case here,\n   say so.\n2. If there is something worth changing, name it plainly. If there is not, say\n   that instead of inventing one.\n3. If this keeps happening, tell me what to look at across all of them rather\n   than this one.\n4. One thing worth doing this week.\n\nBe kind but do not manage my feelings. I would rather have it straight."},{"id":"c17t1","course":17,"title":"Planning a week you will actually finish","note":"Point 3 is the useful one. A plan that does not say what you are dropping is a wish list with dates on it.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"What has to happen this week","hint":"List everything"},{"id":"f1","label":"Hours I genuinely have","hint":"Be honest, after work and family","long":true},{"id":"f2","label":"What always eats my time unexpectedly","hint":"Name it"},{"id":"f3","label":"What matters most if I only do one thing","hint":"The one thing"}],"template":"Help me plan a week I can actually finish.\n\nWhat has to happen this week: {f0}.\nHours I genuinely have: {f1}.\nWhat always eats my time unexpectedly: {f2}.\nWhat matters most if I only do one thing: {f3}.\n\nGive me:\n1. The three things worth doing, in order.\n2. Roughly when each one fits, given my real hours.\n3. What I am not doing this week, said plainly.\n4. The one thing to protect if the week goes wrong.\n\nDo not give me a list of ten. I will finish none of them."},{"id":"c17t2","course":17,"title":"Breaking down the thing you keep avoiding","note":"Question four settles a surprising number of these. Some things are not worth doing, and nobody ever gives you permission to drop them.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"The task","hint":"What it is"},{"id":"f1","label":"How long it has been on my list","hint":"Be honest"},{"id":"f2","label":"Why I think I am avoiding it","hint":"Your real guess, even if it is that it is boring or that I am worried about it","long":true},{"id":"f3","label":"How much time I could give it today","hint":"Realistically"}],"template":"There is something I keep putting off.\n\nThe task: {f0}.\nHow long it has been on my list: {f1}.\nWhy I think I am avoiding it: {f2}.\nHow much time I could give it today: {f3}.\n\nTell me:\n1. What is actually making this hard. Be honest with me.\n2. The smallest possible first step, something I could do\n   in the time I named.\n3. What done looks like, so I know when to stop.\n4. What happens if I simply never do it."},{"id":"c17t3","course":17,"title":"Cutting the admin that fills your day","note":"Write the templates the same day. A list of things you could automate is just another list if you leave it a week.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Small things I do repeatedly","hint":"List them, including the tiny ones","long":true},{"id":"f1","label":"How often each happens","hint":"Daily, weekly, constantly","long":true},{"id":"f2","label":"Which ones I dread","hint":"Be honest"}],"template":"I am busy all day and cannot say what I finished.\n\nSmall things I do repeatedly: {f0}.\nHow often each happens: {f1}.\nWhich ones I dread: {f2}.\n\nTell me:\n1. Which of these nobody would notice if I stopped.\n2. Which should be done once a week in a block instead\n   of whenever they arrive.\n3. Which could become a template or a saved reply.\n4. What I would get back in hours if I did all three."},{"id":"x17_32","course":17,"title":"Walk in knowing what you need","note":"Five minutes before, not the night before.","kind":"Prepare for a meeting in five minutes","setup":[],"fields":[{"id":"agenda","label":"The agenda or the last notes","hint":"Paste whatever exists","options":null,"long":true},{"id":"about","label":"What the meeting is for","hint":""},{"id":"who","label":"Who will be there","hint":""},{"id":"mine","label":"What you need out of it","hint":""}],"template":"I have a meeting shortly. Get me ready in five minutes.\n\nWhat it is for: {about}\nWho will be there: {who}\nWhat I need out of it: {mine}\n\nThe agenda or last notes:\n{agenda}\n\nGive me:\n1. The decisions that need to be made in this meeting, as questions.\n2. What I need to have an opinion on before I walk in, and a one line position\n   on each based on what is here.\n3. The two things most likely to come up that are not on the agenda.\n4. What I should say in the first two minutes to get what I need out of it.\n5. Anything in these notes that was promised last time and has not been\n   mentioned since.\n\nKeep the whole thing short enough to read while walking."},{"id":"x17_33","course":17,"title":"Say no without the paragraph of apology","note":"Most people rewrite this six times and send it apologetically anyway.","kind":"Say no without a paragraph","setup":[],"fields":[{"id":"ask","label":"What you are being asked","hint":""},{"id":"who","label":"Who is asking","hint":"And how much the relationship matters"},{"id":"why","label":"Why you are saying no","hint":"Honestly, even if you will not say all of it"},{"id":"door","label":"Do you want to leave the door open","hint":"","options":["Yes, another time genuinely","Yes, but only politely","No, a clean no"]},{"id":"how","label":"How you will send it","hint":"","options":["Email","A message","In person"]}],"template":"Help me say no.\n\nWhat I am being asked: {ask}\nWho is asking: {who}\nWhy I am saying no: {why}\nDoor open: {door}\nHow I am sending it: {how}\n\nRules:\n- Three sentences at most.\n- No apologising twice, no explaining myself at length, no inventing a reason.\n- Warm, clear, and final. Nothing that sounds like it could be negotiated\n  unless I said to leave the door open.\n- Do not start with \"Unfortunately\" or \"I am so sorry but\".\n\nGive me two versions, one warmer and one shorter. Then tell me honestly if\neither still sounds like a maybe."},{"id":"x17_34","course":17,"title":"Work out where the day actually went","note":"List what you did. The pattern is usually uncomfortable and useful.","kind":"Work out where the day went","setup":[],"fields":[{"id":"did","label":"What you did today","hint":"Everything, in any order, however small","options":null,"long":true},{"id":"felt","label":"How the day felt","hint":"","options":["Busy but I got nothing done","Productive","Scattered","I do not know where it went"]},{"id":"meant","label":"What you had meant to do","hint":""}],"template":"Here is everything I did today. Help me see the pattern.\n\nHow it felt: {felt}\nWhat I had meant to do: {meant}\n\nWhat I actually did:\n{did}\n\nTell me:\n1. Roughly how the time split, by type of work rather than by task.\n2. Which of it only I could have done, and which did not need to be me.\n3. What quietly ate the most time without being important.\n4. Why the thing I meant to do did not happen, based on the evidence rather\n   than on willpower.\n5. The single change that would have made the most difference today.\n\nBe direct. I am not asking to be reassured."},{"id":"x17_35","course":17,"title":"A Monday routine you will actually keep","note":"Short, repeatable, and done before the week decides for you.","kind":"Set up a Monday routine","setup":[],"fields":[{"id":"work","label":"What your work looks like","hint":""},{"id":"time","label":"How long you will realistically give it","hint":"","options":["Fifteen minutes","Half an hour","An hour"]},{"id":"wrong","label":"What usually goes wrong in your week","hint":"The thing that keeps happening"},{"id":"tools","label":"What you already use","hint":"Such as a paper diary, a calendar, a notes app"}],"template":"Help me build a Monday routine that I will actually keep.\n\nMy work: {work}\nHow long I will realistically give it: {time}\nWhat usually goes wrong in my week: {wrong}\nWhat I already use: {tools}\n\nGive me:\n1. The routine as a short ordered list, with a rough time for each step,\n   adding up to no more than {time}.\n2. For each step, the question it answers, so I know why it is there.\n3. The one step that fixes the thing that keeps going wrong.\n4. What to drop first on a week when I do not have the time.\n5. How I will know in a month whether it is working.\n\nBuild it around what I already use. Do not tell me to adopt a new system."},{"id":"c18t1","course":18,"title":"Finding the idea you already have","note":"Be honest about what you know and do not overthink the list. The more ordinary it sounds to you, the more likely someone else needs it.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"List 3 to 5","hint":"Such as meal planning, organising a home, using Canva, writing resumes, budgeting, or a skill from your job","long":true},{"id":"f1","label":"Which one","hint":"Pick the closest","options":["Plenty of","Limited"]},{"id":"f2","label":"Which one","hint":"Pick the closest","options":["Simple and fast","More detailed"]}],"template":"Help me find a digital product idea I could actually sell.\nI have never done this before.\n\nThings I know, have done, or people ask my advice about:\n{f0}\n\nMy situation: I have {f1} time.\nI want something {f2}.\n\nTell me:\n1. Which idea from my list would sell best, and exactly why.\n2. Who would buy it, described specifically.\n3. What format suits it: guide, checklist, prompt pack or\n   template.\n4. Honestly, is this worth building? Say so if it is not."},{"id":"c18t2","course":18,"title":"Building the product itself","note":"Fill in the marked gaps yourself. Your own examples are the reason someone pays for this instead of searching for it free.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Working title","hint":""},{"id":"f1","label":"Your buyer","hint":""},{"id":"f2","label":"The problem","hint":""}],"template":"I am making a digital product called {f0},\nfor {f1}, solving {f2}.\n\nGive me:\n1. The full outline: every section, with one line on what it\n   covers and why it is there.\n2. Then write the content for each section, one at a time,\n   stopping after each so I can read it.\n\nEvery section must give the reader something concrete to do\nor know. No filler and no padding to make it look longer.\n\nLeave a clearly marked gap in each section where my own\nexample or story should go."},{"id":"c18t3","course":18,"title":"Writing the listing and the launch","note":"Write all five in one session. A finished product with no listing sells exactly as well as an unfinished one.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"Here is my finished product","hint":"Paste the outline or describe what it contains","long":true},{"id":"f1","label":"My buyer","hint":"Who they are"},{"id":"f2","label":"The result they get","hint":"The one outcome"}],"template":"Here is my finished product: {f0}.\n\nMy buyer: {f1}.\nThe result they get: {f2}.\n\nWrite all of these:\n1. Three possible titles, plain rather than clever.\n2. A listing description under 200 words.\n3. Five bullets on what they will be able to do, each\n   starting with a verb.\n4. A launch post for social media, under 150 words.\n5. The delivery email they get after buying.\n\nNo hype. Plain, warm and specific throughout."},{"id":"x18_36","course":18,"title":"Name it without agonising for a week","note":"For the product, the offer, the service or the business itself.","kind":"Name the thing","setup":[],"fields":[{"id":"what","label":"What it is","hint":"What it does and who it is for","options":null,"long":true},{"id":"feel","label":"How it should feel","hint":"","options":["Plain and clear","Warm and friendly","Serious and credible","A bit of character"]},{"id":"avoid","label":"What to avoid","hint":"Such as puns, anything hard to spell, anything too clever"},{"id":"where","label":"Where the name has to work","hint":"Such as a web address, a logo, said out loud on a call"}],"template":"Help me name something.\n\nWhat it is: {what}\nHow it should feel: {feel}\nWhat to avoid: {avoid}\nWhere it has to work: {where}\n\nGive me 20 names in four groups of five:\n- Plainly descriptive, so nobody has to ask what it is.\n- A real word used slightly differently.\n- Two words joined, where the join actually means something.\n- One unexpected direction I would not have considered.\n\nFor each, one line on why it works. Then shortlist the three you would\nactually use and say what is wrong with each of them, because every name has\nsomething wrong with it.\n\nSkip anything that is hard to spell after hearing it out loud."},{"id":"x18_37","course":18,"title":"The email that goes out with the thing","note":"Sent at the moment someone has just paid and is wondering if they should have.","kind":"The delivery email","setup":[],"fields":[{"id":"what","label":"What they have bought","hint":""},{"id":"get","label":"What they get and where","hint":"Links, files, access, all of it","options":null,"long":true},{"id":"first","label":"What you want them to do first","hint":""},{"id":"worry","label":"What they might be worried about","hint":"Such as whether it will be too technical"},{"id":"tone","label":"How it should sound","hint":"","options":["Warm and personal","Brisk and clear","Excited but not over the top"]}],"template":"Write the email that goes out the moment someone buys.\n\nWhat they bought: {what}\nWhat they get and where: {get}\nWhat I want them to do first: {first}\nWhat they might be quietly worried about: {worry}\nHow it should sound: {tone}\n\nRules:\n- Confirm what they bought in the first line, so they know the money arrived\n  somewhere real.\n- Access details next, before anything else. Not after a paragraph of thanks.\n- One clear first step. Not five things they could do.\n- Address the worry once, briefly, without making it bigger than it is.\n- Under 200 words, with a subject line.\n\nThen give me a one line postscript that would make them glad they bought."},{"id":"x18_38","course":18,"title":"Answer the questions before they ask","note":"The questions people have but do not send, and then do not buy.","kind":"Answer buyer questions","setup":[],"fields":[{"id":"what","label":"What you are selling","hint":""},{"id":"who","label":"Who buys it","hint":""},{"id":"asked","label":"What people have actually asked","hint":"Optional, if you have had questions","options":null,"long":true},{"id":"doubt","label":"What you suspect puts people off","hint":""}],"template":"Help me answer the questions buyers have but never send.\n\nWhat I am selling: {what}\nWho buys it: {who}\nWhat people have actually asked: {asked}\nWhat I suspect puts people off: {doubt}\n\nGive me:\n1. The ten questions this buyer is most likely to be thinking, in the order\n   they would think them.\n2. Which of those are really the same worry wearing different clothes.\n3. A short honest answer to each, in my voice, that does not oversell.\n4. The one question I should answer on the page before anyone has to ask it.\n5. Any question where the honest answer is that this is not for them, and how\n   to say that plainly. Saying it loses one sale and saves three refunds."},{"id":"x18_39","course":18,"title":"Decide what to make next","note":"Based on what already happened, not on what sounds exciting.","kind":"Plan the next one","setup":[],"fields":[{"id":"did","label":"What you have already made","hint":"And how it went","options":null,"long":true},{"id":"heard","label":"What buyers have asked for or complained about","hint":""},{"id":"time","label":"How much time you have","hint":""},{"id":"goal","label":"What you want from the next one","hint":"","options":["More income from the same people","Reaching new people","Something easier to deliver","Proving an idea before I build it properly"]}],"template":"Help me decide what to make next.\n\nWhat I have already made and how it went: {did}\nWhat buyers have asked for or complained about: {heard}\nHow much time I have: {time}\nWhat I want from the next one: {goal}\n\nGive me:\n1. Three options, each with what it is, who it is for, and why it follows from\n   what has already happened.\n2. For each, the smallest version I could make first to find out whether I am\n   right.\n3. Which one you would choose given {goal}, and plainly why.\n4. The one I should not build, and what is wrong with it.\n5. What I should stop doing to make room for this.\n\nBase it on the evidence I gave you. If the honest answer is that I should sell\nmore of what I already have rather than build something new, say that."},{"id":"c19t1","course":19,"title":"Seeing where your money actually goes","note":"Rough is fine. You are looking for the shape of it, and exact figures would not change the answer.","kind":"Course task 1","setup":[],"fields":[{"id":"f0","label":"Which one","hint":"Pick the closest","options":["Household","Business"]},{"id":"f1","label":"Coming in each month","hint":"Roughly"},{"id":"f2","label":"Fixed things I cannot easily change","hint":"Rent or mortgage, travel, bills, anything else","long":true},{"id":"f3","label":"Things that vary","hint":"Food, going out, shopping, whatever applies","long":true},{"id":"f4","label":"What I owe, if anything","hint":"Be honest, or write none","long":true}],"template":"Help me understand where the money goes. Rough numbers\nare fine. This is for my {f0}.\n\nComing in each month: {f1}.\nFixed things I cannot easily change: {f2}.\nThings that vary: {f3}.\nWhat I owe, if anything: {f4}.\n\nTell me:\n1. Where most of it actually goes, in plain terms.\n2. Which part is probably bigger than I realise.\n3. What looks normal and is not worth worrying about.\n4. One question I should ask myself before changing anything."},{"id":"c19t2","course":19,"title":"Deciding what to change first","note":"Point 4 is why this works. A change that makes your life miserable gets reversed, so it was never a saving.","kind":"Course task 2","setup":[],"fields":[{"id":"f0","label":"Here is my situation","hint":"Paste what you worked out in the last task","long":true},{"id":"f1","label":"What I want","hint":"Pick the closest","options":["Save a set amount","Clear something I owe","Have more left at month end","Just stop worrying"]},{"id":"f2","label":"What I am not willing to give up","hint":"Be honest, it matters","long":true}],"template":"Here is my situation: {f0}.\n\nWhat I want: {f1}.\nWhat I am not willing to give up: {f2}.\n\nTell me:\n1. The single change that would make the most difference.\n2. What it is actually worth over a year.\n3. Two smaller changes I would barely notice.\n4. What to leave alone, because cutting it would not last.\n\nOne change, not a plan with nine parts."},{"id":"c19t3","course":19,"title":"Pricing, chasing and awkward money talk","note":"Undercharging is the most expensive habit here, and the one nobody ever points out to you.","kind":"Course task 3","setup":[],"fields":[{"id":"f0","label":"The work","hint":""},{"id":"f1","label":"Time","hint":""},{"id":"f2","label":"Amount","hint":""},{"id":"f3","label":"Who","hint":""},{"id":"f4","label":"When","hint":""},{"id":"f5","label":"How many","hint":""},{"id":"f6","label":"The thing","hint":""}],"template":"Help me with a money conversation I have been avoiding.\nPick the one that applies.\n\nPRICING: I do {f0}. It takes me {f1}. I charge\n{f2} now. What is it actually worth, and how do I say\nthe new number without apologising for it?\n\nCHASING: I am owed {f2} by {f3}, due {f4}. I have\nasked {f5} times. Write the next message: warm,\nfirm, with a clear date in it.\n\nDECLINING: I have been asked to {f6} and cannot\nafford it. Write the reply that says no without three\nparagraphs of excuses.\n\nGive me the words, and tell me what I am getting wrong\nabout the situation."},{"id":"x19_40","course":19,"title":"Understand what you are actually paying for","note":"Line by line, including the charges nobody explains.","kind":"Understand a bill or a statement","setup":[],"fields":[{"id":"doc","label":"The bill or statement","hint":"Paste it, or type out the lines you do not understand","options":null,"long":true},{"id":"what","label":"What it is for","hint":"Such as energy, a bank account, a phone, insurance"},{"id":"expect","label":"What you were expecting","hint":"Such as about the same as last time"},{"id":"worry","label":"What specifically confuses you","hint":""}],"template":"Help me understand this {what} bill.\n\nWhat I was expecting: {expect}\nWhat confuses me: {worry}\n\nThe bill:\n{doc}\n\nTell me:\n1. What each line actually is, in plain words, including anything that is a\n   fee rather than the thing itself.\n2. Whether anything looks unusual compared with what I said I was expecting.\n3. Anything I appear to be paying for that I may not be using.\n4. The questions worth asking them, worded so they have to answer properly.\n5. What I would need to check myself, because you cannot see my account.\n\nDo not guess at numbers that are not in front of you. If something is unclear\nfrom what I pasted, say which part you would need."},{"id":"x19_41","course":19,"title":"Compare two options without going round in circles","note":"For the decision you keep reopening and never finishing.","kind":"Compare two options properly","setup":[],"fields":[{"id":"a","label":"Option A","hint":"What it is, and what it costs you in money, time or risk","options":null,"long":true},{"id":"b","label":"Option B","hint":"Same again","options":null,"long":true},{"id":"matters","label":"What actually matters to you","hint":"Be honest, including the things that are not financial"},{"id":"worry","label":"What you are afraid of getting wrong","hint":""},{"id":"when","label":"When you have to decide by","hint":""}],"template":"Help me compare two options properly.\n\nOption A: {a}\nOption B: {b}\nWhat actually matters to me: {matters}\nWhat I am afraid of getting wrong: {worry}\nWhen I have to decide: {when}\n\nDo this:\n1. Put them side by side against what I said matters, not against a generic\n   list of pros and cons.\n2. Show the arithmetic where there is any, including anything that looks\n   cheaper now and is not over time.\n3. Name what I have not accounted for in either one.\n4. Say which is better and why, in one paragraph, with no hedging.\n5. Say what would have to be true for the other one to be the right answer.\n\nIf the honest answer is that there is very little in it, say so and tell me\nwhich one is easier to reverse."},{"id":"x19_42","course":19,"title":"Write the money message you keep putting off","note":"Chasing what you are owed, or saying what something will cost.","kind":"Write the awkward money message","setup":[],"fields":[{"id":"kind","label":"What it is","hint":"","options":["Chasing an unpaid invoice","Telling someone my price","Asking a friend or family member for money back","Saying I cannot afford something","Raising my prices"]},{"id":"who","label":"Who it is to","hint":"And how much the relationship matters"},{"id":"detail","label":"The facts","hint":"Amounts, dates, what was agreed","options":null,"long":true},{"id":"history","label":"What has happened so far","hint":"Any reminders or promises"},{"id":"firm","label":"How firm","hint":"","options":["Gentle first mention","Clear and businesslike","Firm, this is overdue","Final reminder"]}],"template":"Write a message about money that I am putting off sending.\n\nWhat it is: {kind}\nWho it is to: {who}\nThe facts: {detail}\nWhat has happened so far: {history}\nHow firm: {firm}\n\nRules:\n- Short. Four sentences at most.\n- Say the amount and the date plainly. Do not bury them.\n- No apologising for asking. This is not a favour.\n- Warm where the relationship matters, businesslike where it does not.\n- End with one specific thing I am asking them to do, and by when.\n\nThen tell me what I should do if they do not reply, and when."},{"id":"x19_43","course":19,"title":"Work out how to afford the thing that is coming","note":"The expense you can see arriving and have not done the maths on.","kind":"Plan for something coming up","setup":[],"fields":[{"id":"what","label":"What is coming","hint":""},{"id":"when","label":"When","hint":""},{"id":"cost","label":"Roughly what it will cost","hint":"Your best estimate, and what is in it"},{"id":"have","label":"What you have set aside so far","hint":""},{"id":"spare","label":"What you could realistically put aside each month","hint":""},{"id":"flex","label":"What could move if it has to","hint":"Such as the date, the scale, or nothing"}],"template":"Help me work out how to afford something that is coming up.\n\nWhat it is: {what}\nWhen: {when}\nRoughly what it will cost: {cost}\nWhat I have set aside: {have}\nWhat I could realistically put aside each month: {spare}\nWhat could move if it has to: {flex}\n\nWork it through:\n1. The arithmetic. How much is still needed, over how many months, and what\n   that is per month. Show the workings.\n2. Whether what I said I could set aside gets me there. Say plainly if it does\n   not.\n3. The costs people forget with this sort of thing, that are probably not in\n   my estimate.\n4. If there is a gap, the options in order of how much they hurt.\n5. What to do this week.\n\nUse only my figures. Do not invent prices or assume what things cost."}],"picker":{"steps":[{"id":"job","q":"What are you actually trying to do?","options":["Write something","Find something out","Understand a document I have","Make a picture","Think it through out loud","Study or revise something"]},{"id":"where","q":"Where are you working?","options":["In a browser","On my phone","In Word or Outlook","In Google Docs or Gmail","In WhatsApp or Instagram"]},{"id":"current","q":"Does the answer depend on something recent?","options":["Yes, it has to be current","No, it does not change","I am not sure"]}],"rules":[["Write something",{"Claude":3,"ChatGPT":3,"Gemini":2,"Microsoft Copilot":1}],["Find something out",{"Perplexity":4,"Gemini":2,"ChatGPT":1}],["Understand a document I have",{"Gemini Notebook":4,"Claude":3,"DeepSeek":2}],["Make a picture",{"Gemini":3,"Meta AI":2,"ChatGPT":2}],["Think it through out loud",{"ChatGPT":3,"Gemini":3,"Meta AI":1}],["Study or revise something",{"Gemini Notebook":4,"Claude":2,"ChatGPT":1}],["In a browser",{"Claude":1,"ChatGPT":1,"Perplexity":1,"Gemini":1}],["On my phone",{"Meta AI":2,"ChatGPT":1,"Gemini":1}],["In Word or Outlook",{"Microsoft Copilot":4}],["In Google Docs or Gmail",{"Gemini":4}],["In WhatsApp or Instagram",{"Meta AI":4}],["Yes, it has to be current",{"Perplexity":3,"Gemini":2,"DeepSeek":1}],["No, it does not change",{"Claude":1,"ChatGPT":1}]],"why":{"Claude":"Best of these for writing that has to sound like a person, and for working through a long document in one place.","ChatGPT":"The most general purpose of them. If you are not sure, it will not be the wrong answer.","Gemini":"Strongest when your work already lives in Google Docs and Gmail, and when you want a picture in the same conversation.","Gemini Notebook":"Built for material you already have. It answers from your sources rather than from the internet, which is what you want when studying.","Perplexity":"Made for finding things out. It shows you where each answer came from, which matters when you have to be right.","Meta AI":"Already inside the apps on your phone, so it is the one you will actually use for something quick.","Microsoft Copilot":"The one that works inside your documents and email rather than in a separate window.","DeepSeek":"Shows its reasoning as it goes, so you can see where an answer came from and where it went wrong."}}};</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const byId={};D.prompts.forEach(p=>byId[p.id]=p);
const cname={};D.courses.forEach(c=>cname[c.num]=c);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=id=>'aimpb-'+id;
function load(id){try{return JSON.parse(localStorage.getItem(K(id)))||{}}catch(e){return{}}}
function save(id,v){try{localStorage.setItem(K(id),JSON.stringify(v))}catch(e){}}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');
  setTimeout(()=>x.classList.remove('on'),1400)}
function go(s){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+s).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'})}

/* ---------------------------------------------------------------- home --- */
function renderHome(q){
  q=(q||'').trim().toLowerCase();
  const box=$('#list');
  if(q){
    const hits=D.prompts.filter(p=>
      (p.title+' '+p.kind+' '+cname[p.course].name).toLowerCase().includes(q));
    box.innerHTML=hits.length?hits.map(p=>
      `<button class="row" data-p="${p.id}"><div class="rtitle">${esc(p.title)}</div>
       <div class="rcourse">${p.course===20?'':'Course '+esc(cname[p.course].label)+' &middot; '}${esc(cname[p.course].name)}</div>
       <div class="rkind">${esc(p.kind)}</div></button>`).join('')
      :'<div class="empty">Nothing matches that. Try a word from the course name, or what you are trying to do.</div>';
  }else{
    box.innerHTML=D.courses.map(c=>{
      const ps=D.prompts.filter(p=>p.course===c.num);
      const taught=ps.filter(p=>p.kind.startsWith('Course'));
      const extra=ps.filter(p=>!p.kind.startsWith('Course'));
      const rows=l=>l.map(p=>
        `<button class="row" data-p="${p.id}"><div class="rtitle">${esc(p.title)}</div>
         <div class="rkind">${esc(p.kind)}</div></button>`).join('');
      const inner = c.num===20
        ? `<div class="grpnote" style="margin:12px 3px 2px">One for each day of the
             planner, for when the day's own prompt did not quite get you there.</div>
           ${rows(ps)}`
        : `<div class="grp">The ${taught.length} taught in the course</div>${rows(taught)}
           <div class="grp gold">${extra.length} more ways to use it</div>
           <div class="grpnote">The course names these and never gives you the prompt. These are new.</div>
           ${rows(extra)}`;
      return `<div class="course" data-c="${c.num}">
        <button class="chead"><span class="cnum">${esc(c.label||c.num)}</span>
          <span class="cname">${esc(c.name)}</span>
          <span class="cmeta">${ps.length} prompts</span></button>
        <div class="clist">${inner}</div></div>`;
    }).join('');
  }
  $$('.chead').forEach(b=>b.onclick=()=>b.closest('.course').classList.toggle('open'));
  $$('[data-p]').forEach(b=>b.onclick=()=>openPrompt(b.dataset.p));
}

/* -------------------------------------------------------------- prompt --- */
function openPrompt(id){
  const p=byId[id],c=cname[p.course],v=load(id);
  $('#pcourse').textContent=(p.course===20?'':'Course '+c.label+' \u00b7 ')+c.name;
  $('#ptitle').textContent=p.title;
  $('#pnote').textContent=p.note||'';
  $('#psetup').innerHTML=p.setup&&p.setup.length
    ?`<b>Do this first</b><ol>${p.setup.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';
  $('#psetup').style.display=p.setup&&p.setup.length?'block':'none';

  $('#pfields').innerHTML=p.fields.map(f=>{
    const h=f.hint?`<span class="h">${esc(f.hint)}</span>`:'';
    if(f.options)
      return `<label for="${f.id}">${esc(f.label)}${h}</label><select id="${f.id}">`+
        ['<option value=""></option>'].concat(f.options.map(o=>`<option>${esc(o)}</option>`)).join('')+'</select>';
    if(f.long)
      return `<label for="${f.id}">${esc(f.label)}${h}</label><textarea id="${f.id}"></textarea>`;
    return `<label for="${f.id}">${esc(f.label)}${h}</label><input type="text" id="${f.id}">`;
  }).join('')||'<p class="note">This one has nothing to fill in. Copy it as it is.</p>';

  p.fields.forEach(f=>{if(v[f.id]!==undefined)$('#'+f.id).value=v[f.id]});

  function render(){
    const cur={},missing=[];
    p.fields.forEach(f=>{
      const val=($('#'+f.id).value||'').trim();
      cur[f.id]=val;
      if(!val)missing.push(f.label);
    });
    let out=p.template;
    p.fields.forEach(f=>{
      out=out.split('{'+f.id+'}').join(cur[f.id]||('['+f.label.toLowerCase()+']'));
    });
    $('#pout').textContent=out.trim();
    const m=$('#pmiss');
    if(!p.fields.length){m.textContent='';}
    else if(missing.length){m.className='miss';
      m.textContent='Still to fill in: '+missing.join(', ');}
    else{m.className='miss done';
      m.textContent='Every box is filled in. This is as specific as it gets.';}
    save(id,cur);
  }
  $('#pfields').oninput=render;$('#pfields').onchange=render;
  $('#pcopy').onclick=async()=>{
    const t=$('#pout').textContent;
    try{await navigator.clipboard.writeText(t)}
    catch(e){const r=document.createRange();r.selectNode($('#pout'));
      getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}
    toast('Copied');
  };
  $('#pclear').onclick=()=>{p.fields.forEach(f=>$('#'+f.id).value='');render()};
  render();go('s-prompt');
}

/* -------------------------------------------------------------- picker --- */
let PA={},pi=0;
function renderPick(){
  const s=D.picker.steps[pi];
  $('#qstep').textContent='Question '+(pi+1)+' of '+D.picker.steps.length;
  $('#qtext').textContent=s.q;
  $('#qopts').innerHTML=s.options.map(o=>
    `<button data-v="${esc(o)}" class="${PA[s.id]===o?'sel':''}">${esc(o)}</button>`).join('');
  $$('#qopts button').forEach(b=>b.onclick=()=>{
    PA[s.id]=b.dataset.v;
    if(pi<D.picker.steps.length-1){pi++;renderPick()}else{showPick()}
  });
  $('#qback').style.visibility=pi?'visible':'hidden';
}
function showPick(){
  const score={};
  D.picker.rules.forEach(([ans,tools])=>{
    if(Object.values(PA).includes(ans))
      for(const t in tools)score[t]=(score[t]||0)+tools[t];
  });
  const ranked=Object.entries(score).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length){$('#pickout').innerHTML='<p class="note">Answer the questions and the answer appears here.</p>';}
  else{
    const [top]=ranked;
    const courseOf=D.courses.find(c=>c.name===top[0]);
    $('#pickout').innerHTML=
      `<div class="winner"><div class="nm">${esc(top[0])}</div>
        <div class="note" style="margin:0">${esc(D.picker.why[top[0]]||'')}</div>
        ${courseOf?`<div class="bar"><button class="btn sm" id="gocourse">Open Course ${esc(courseOf.label)}</button></div>`:''}
      </div>`+
      ranked.slice(1,3).map(([t])=>
        `<div class="alt"><b>${esc(t)}</b> would also work. ${esc(D.picker.why[t]||'')}</div>`).join('')+
      `<div class="alt" style="color:var(--dim)">There is rarely one right answer. If you already use one of these every day, use that one.</div>`;
    const gc=$('#gocourse');
    if(gc)gc.onclick=()=>{go('s-home');$('#q').value='';renderHome('');
      const el=document.querySelector('.course[data-c="'+courseOf.num+'"]');
      if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'})}};
  }
  go('s-pickout');
}

/* ----------------------------------------------------------------- wire --- */
$('#q').addEventListener('input',e=>renderHome(e.target.value));
$('#openpick').onclick=()=>{PA={};pi=0;renderPick();go('s-pick')};
$('#qback').onclick=()=>{if(pi){pi--;renderPick()}};
$('#qcancel').onclick=()=>go('s-home');
$('#pickagain').onclick=()=>{PA={};pi=0;renderPick();go('s-pick')};
$('#pickhome').onclick=()=>go('s-home');
$('#pback').onclick=()=>go('s-home');
$('#count').textContent=D.prompts.length+' prompts';
renderHome('');
</script>
</body></html>
